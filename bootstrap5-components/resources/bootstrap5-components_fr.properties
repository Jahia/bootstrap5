bootstrap5nt_carouselItem.jcr_title.ui.tooltip=Affich\u00E9 sur l\u2019image, et lu aux personnes qui ne la voient pas.
bootstrap5nt_accordion.jcr_title.ui.tooltip=L\u2019en-t\u00EAte cliquable qui ouvre et ferme le panneau.
bootstrap5nt_button.jcr_title.ui.tooltip=Ce qu\u2019affiche le bouton. S\u2019il est vide, un lien interne affiche le titre de la page cible, les autres boutons affichent \u00AB Lire la suite \u00BB.
bootstrap5nt_card.jcr_title.ui.tooltip=Affich\u00E9 dans l\u2019en-t\u00EAte de la carte. Laissez vide pour une carte sans en-t\u00EAte.
bootstrap5nt_figure.jcr_title.ui.tooltip=Court texte affich\u00E9 sous l\u2019image.
bootstrap5nt_buttonGroup.jcr_title.ui.tooltip=Non affich\u00E9. Indique aux utilisateurs de lecteurs d\u2019\u00E9cran ce que les boutons ont en commun, par exemple \u00AB Partager \u00BB.
bootstrap5mix_padding_description=Espace \u00E0 l\u2019int\u00E9rieur du composant, entre son bord et son contenu.
bootstrap5mix_padding.paddingWhere.ui.tooltip=C\u00F4t\u00E9s qui re\u00E7oivent l\u2019espace. \u00AB D\u00E9but \u00BB et \u00AB Fin \u00BB sont la gauche et la droite dans les langues lues de gauche \u00E0 droite, et s\u2019inversent dans les langues lues de droite \u00E0 gauche.
bootstrap5mix_padding.paddingSize.ui.tooltip=De 0 (aucun) \u00E0 5 (le plus grand). Un rem est la taille du texte de base, en g\u00E9n\u00E9ral 16 pixels : \u00AB 3 \u2014 1rem \u00BB repr\u00E9sente la hauteur d\u2019une ligne de texte.
bootstrap5mix_margin_description=Espace \u00E0 l\u2019ext\u00E9rieur du composant, entre lui et ses voisins.
bootstrap5mix_margin.marginWhere.ui.tooltip=C\u00F4t\u00E9s qui re\u00E7oivent l\u2019espace. \u00AB D\u00E9but \u00BB et \u00AB Fin \u00BB sont la gauche et la droite dans les langues lues de gauche \u00E0 droite, et s\u2019inversent dans les langues lues de droite \u00E0 gauche.
bootstrap5mix_margin.marginSize.ui.tooltip=De 0 (aucun) \u00E0 5 (le plus grand). Un rem est la taille du texte de base, en g\u00E9n\u00E9ral 16 pixels : \u00AB 3 \u2014 1rem \u00BB repr\u00E9sente la hauteur d\u2019une ligne de texte.
bootstrap5mix_imageAdvancedSettings_description=R\u00E9glages facultatifs de l\u2019affichage de l\u2019image.
bootstrap5mix_imageAdvancedSettings.imageClass.ui.tooltip=Pour les int\u00E9grateurs : classes CSS ajout\u00E9es \u00E0 l\u2019image, s\u00E9par\u00E9es par des espaces.
bootstrap5mix_imageAdvancedSettings.imageStyle.ui.tooltip=Pour les int\u00E9grateurs : d\u00E9clarations CSS appliqu\u00E9es \u00E0 cette image seulement, par exemple max-width: 300px.
bootstrap5mix_imageAdvancedSettings.imageID.ui.tooltip=Pour les int\u00E9grateurs : identifiant servant \u00E0 cibler cette image depuis un lien, un script ou une feuille de style. Doit \u00EAtre unique dans la page.
bootstrap5mix_imageAdvancedSettings.responsive.ui.tooltip=L\u2019image r\u00E9tr\u00E9cit avec son conteneur et ne le d\u00E9passe jamais. \u00C0 d\u00E9cocher seulement pour une image qui doit garder sa taille exacte.
bootstrap5mix_imageAdvancedSettings.thumbnails.ui.tooltip=Ajoute une fine bordure et une petite marge autour de l\u2019image.
bootstrap5mix_imageAdvancedSettings.align.ui.tooltip=\u00AB D\u00E9but \u00BB et \u00AB Fin \u00BB placent l\u2019image d\u2019un c\u00F4t\u00E9 et laissent le texte s\u2019\u00E9couler autour (LTR d\u00E9signe une langue lue de gauche \u00E0 droite ; sinon les c\u00F4t\u00E9s s\u2019inversent). \u00AB Centre \u00BB place l\u2019image seule sur sa ligne.
bootstrap5mix_imageAdvancedSettings.alt.ui.tooltip=D\u00E9crit l\u2019image aux personnes qui ne la voient pas. S\u2019il est vide, le titre du fichier image est utilis\u00E9.
bootstrap5mix_imageAdvancedSettings.borderRadius.ui.tooltip=Coins \u00E0 arrondir. \u00AB Cercle \u00BB et \u00AB Pilule \u00BB ignorent la taille ci-dessous. \u00AB Aucun \u00BB laisse des coins carr\u00E9s.
bootstrap5mix_imageAdvancedSettings.borderRadiusSize.ui.tooltip=Ampleur de l\u2019arrondi des coins choisis. \u00AB Par d\u00E9faut \u00BB est l\u2019arrondi standard de Bootstrap.
bootstrap5nt_accordion.show.ui.tooltip=Le panneau est ouvert au chargement de la page. Ouvrir un autre panneau le referme.
bootstrap5nt_accordions.flush.ui.tooltip=Pour un accord\u00E9on qui touche les bords de son conteneur, dans une carte ou une colonne lat\u00E9rale par exemple.
bootstrap5mix_alert_description=Affiche ce contenu dans un encadr\u00E9 color\u00E9 qui attire l\u2019attention.
bootstrap5mix_alert.backgroundColor.ui.tooltip=La couleur porte un sens : \u00AB Success \u00BB est vert, \u00AB Warning \u00BB jaune, \u00AB Danger \u00BB rouge, \u00AB Info \u00BB bleu clair. Dites-le aussi dans le texte, la couleur seule n\u2019est pas per\u00E7ue par tous. \u00AB Lien \u00BB et \u00AB Personnalis\u00E9 \u00BB n\u2019ont d\u2019effet que si la feuille de style de votre site les d\u00E9finit.
bootstrap5mix_alert.addDismissButton.ui.tooltip=Les visiteurs peuvent fermer l\u2019encadr\u00E9. Il r\u00E9appara\u00EEt au rechargement de la page.
bootstrap5mix_advancedBreadcrumb.cssClass.ui.tooltip=Pour les int\u00E9grateurs : classes CSS ajout\u00E9es \u00E0 la liste du fil d\u2019Ariane, s\u00E9par\u00E9es par des espaces.
bootstrap5nt_button.buttonType.ui.tooltip=Ce qui se passe au clic sur le bouton. Les r\u00E9glages de l\u2019action choisie apparaissent en dessous.
bootstrap5mix_buttonAdvancedSettings_description=Apparence du bouton.
bootstrap5mix_buttonAdvancedSettings.style.ui.tooltip=Couleur du bouton. \u00AB Primary \u00BB sert \u00E0 l\u2019action principale de la page ; \u00E0 utiliser une seule fois. \u00AB Sans fond \u00BB ressemble \u00E0 un simple lien. \u00AB Personnalis\u00E9 \u00BB retire les classes Bootstrap et n\u2019utilise que le champ de classe CSS.
bootstrap5mix_buttonAdvancedSettings.outline.ui.tooltip=Bordure et texte color\u00E9s sur fond transparent, pour un bouton moins visible.
bootstrap5mix_buttonAdvancedSettings.block.ui.tooltip=Le bouton occupe toute la largeur de son conteneur.
bootstrap5mix_buttonAdvancedSettings.state.ui.tooltip=\u00AB Actif \u00BB affiche le bouton comme enfonc\u00E9. \u00AB D\u00E9sactiv\u00E9 \u00BB le grise et il n\u2019est plus cliquable.
bootstrap5mix_buttonAdvancedSettings.cssClass.ui.tooltip=Pour les int\u00E9grateurs : classes CSS ajout\u00E9es au bouton. Avec le style \u00AB Personnalis\u00E9 \u00BB, ce sont les seules classes du bouton.
bootstrap5mix_buttonAdvancedSettings.disableTextWrapping.ui.tooltip=Le texte reste sur une seule ligne, m\u00EAme dans un conteneur \u00E9troit.
bootstrap5mix_buttonAdvancedSettings.stretchedLink.ui.tooltip=Un clic n\u2019importe o\u00F9 dans le bloc qui contient le bouton, une carte par exemple, suit le lien.
bootstrap5mix_buttonAdvancedSettings.tooltip.ui.tooltip=Petit texte affich\u00E9 quand le bouton est survol\u00E9 ou re\u00E7oit le focus. Sur \u00E9cran tactile il peut ne jamais appara\u00EEtre : n\u2019y mettez pas d\u2019information essentielle.
bootstrap5mix_collapse_description=Le bouton affiche et masque le contenu que vous ajoutez sous lui dans la page.
bootstrap5mix_collapse.show.ui.tooltip=Le contenu est visible au chargement de la page.
bootstrap5mix_internalLink_description=Le bouton ouvre une page ou un fichier de ce site.
bootstrap5mix_externalLink_description=Le bouton ouvre une adresse ext\u00E9rieure \u00E0 ce site.
bootstrap5mix_externalLink.externalLink.ui.tooltip=Adresse compl\u00E8te commen\u00E7ant par https://. Une adresse e-mail (mailto:) ou un num\u00E9ro de t\u00E9l\u00E9phone (tel:) fonctionnent aussi.
bootstrap5mix_modal_description=Le bouton ouvre une fen\u00EAtre par-dessus la page. Ajoutez le contenu de la fen\u00EAtre depuis la page, dans le bouton.
bootstrap5mix_modal.modalTitle.ui.tooltip=Affich\u00E9 en haut de la fen\u00EAtre. Sans titre, la fen\u00EAtre n\u2019a ni en-t\u00EAte ni croix de fermeture.
bootstrap5mix_modal.closeText.ui.tooltip=Texte du bouton en bas de la fen\u00EAtre. \u00AB Fermer \u00BB s\u2019il est vide.
bootstrap5mix_modal.staticBackdrop.ui.tooltip=La fen\u00EAtre ne se ferme qu\u2019avec ses propres boutons, pour un contenu qui doit \u00EAtre lu.
bootstrap5mix_modal.verticallyCentered.ui.tooltip=Centre la fen\u00EAtre dans la hauteur de l\u2019\u00E9cran au lieu de la placer en haut.
bootstrap5mix_popover_description=Le bouton affiche une petite bulle \u00E0 c\u00F4t\u00E9 de lui. Un clic ailleurs la referme.
bootstrap5mix_popover.direction.ui.tooltip=C\u00F4t\u00E9 du bouton o\u00F9 la bulle appara\u00EEt. Elle passe d\u2019un autre c\u00F4t\u00E9 quand la place manque.
bootstrap5mix_popover.html.ui.tooltip=Le contenu est interpr\u00E9t\u00E9 comme du HTML et non comme du texte. \u00C0 cocher seulement pour un contenu que vous avez \u00E9crit vous-m\u00EAme.
bootstrap5mix_Offcanvas_description=Le bouton ouvre un panneau qui glisse depuis un bord de l\u2019\u00E9cran. Ajoutez le contenu du panneau depuis la page, dans le bouton.
bootstrap5mix_Offcanvas.OffcanvasTitle.ui.tooltip=Affich\u00E9 en haut du panneau, \u00E0 c\u00F4t\u00E9 de la croix de fermeture.
bootstrap5mix_Offcanvas.enableBackdrop.ui.tooltip=Assombrit la page derri\u00E8re le panneau ; un clic sur la page assombrie ferme le panneau.
bootstrap5mix_Offcanvas.enableBodyScrolling.ui.tooltip=La page derri\u00E8re le panneau peut encore d\u00E9filer.
bootstrap5nt_buttonGroup.vertical.ui.tooltip=Les boutons sont plac\u00E9s l\u2019un sous l\u2019autre au lieu de c\u00F4te \u00E0 c\u00F4te.
bootstrap5nt_card.headerSize.ui.tooltip=Niveau du titre dans le plan de la page (H2 sous le titre de la page, H3 sous un H2\u2026). Ne change pas la taille du texte. \u00AB Par d\u00E9faut \u00BB est un simple paragraphe, pas un titre.
bootstrap5nt_card.footer.ui.tooltip=Court texte affich\u00E9 en bas de la carte. Pour un contenu plus riche, cochez \u00AB Pied de page enrichi \u00BB dans les param\u00E8tres avanc\u00E9s.
bootstrap5mix_colors_description=Couleurs de la carte. V\u00E9rifiez que le texte reste lisible sur le fond choisi.
bootstrap5mix_cardAdvancedSettings.cssClass.ui.tooltip=Pour les int\u00E9grateurs : remplace la classe \u00AB card \u00BB du bloc ext\u00E9rieur. Gardez \u00AB card \u00BB sauf si vous restylez enti\u00E8rement la carte.
bootstrap5mix_cardAdvancedSettings.cardHeaderCssClass.ui.tooltip=Pour les int\u00E9grateurs : remplace la classe \u00AB card-header \u00BB de l\u2019en-t\u00EAte.
bootstrap5mix_cardAdvancedSettings.cardBodyCssClass.ui.tooltip=Pour les int\u00E9grateurs : remplace la classe \u00AB card-body \u00BB du corps.
bootstrap5mix_cardAdvancedSettings.freeFooter.ui.tooltip=Remplace le texte du pied de page par une zone o\u00F9 n\u2019importe quel contenu peut \u00EAtre ajout\u00E9 depuis la page.
bootstrap5nt_carouselItem.image.ui.tooltip=Utilisez des images de m\u00EAmes proportions pour toutes les diapositives, sinon le carrousel change de hauteur d\u2019une diapositive \u00E0 l\u2019autre.
bootstrap5nt_carouselItem.caption.ui.tooltip=Affich\u00E9 sur l\u2019image, sous le titre.
bootstrap5mix_advancedCarouselItem.titleColor.ui.tooltip=Choisissez une couleur qui reste lisible sur l\u2019image.
bootstrap5mix_advancedCarouselItem.captionColor.ui.tooltip=Choisissez une couleur qui reste lisible sur l\u2019image.
bootstrap5mix_advancedCarouselItem.carouselItemClass.ui.tooltip=Pour les int\u00E9grateurs : classes CSS ajout\u00E9es \u00E0 cette diapositive.
bootstrap5mix_advancedCarouselItem.interval.ui.tooltip=Dur\u00E9e d\u2019affichage de cette diapositive, en millisecondes (5000 = 5 secondes). Vide : le d\u00E9lai du carrousel.
bootstrap5mix_carouselAdvancedSettings_description=Comportement et contr\u00F4les du carrousel.
bootstrap5mix_carouselAdvancedSettings.useIndicators.ui.tooltip=Petites barres en bas, une par diapositive, pour passer directement \u00E0 une diapositive.
bootstrap5mix_carouselAdvancedSettings.interval.ui.tooltip=En millisecondes : 5000 = 5 secondes, la valeur par d\u00E9faut.
bootstrap5mix_carouselAdvancedSettings.keyboard.ui.tooltip=Les fl\u00E8ches gauche et droite changent de diapositive quand le carrousel a le focus.
bootstrap5mix_carouselAdvancedSettings.pause.ui.tooltip=Les diapositives cessent de d\u00E9filer tant que le pointeur est sur le carrousel.
bootstrap5mix_carouselAdvancedSettings.ride.ui.tooltip=Les diapositives d\u00E9filent seules. Un bouton de pause est ajout\u00E9 pour les utilisateurs du clavier et de lecteurs d\u2019\u00E9cran. D\u00E9coch\u00E9, les visiteurs changent de diapositive eux-m\u00EAmes.
bootstrap5mix_carouselAdvancedSettings.wrap.ui.tooltip=Apr\u00E8s la derni\u00E8re diapositive, le carrousel reprend \u00E0 la premi\u00E8re.
bootstrap5mix_carouselAdvancedSettings.fade.ui.tooltip=Une diapositive se fond dans la suivante au lieu de glisser sur le c\u00F4t\u00E9.
bootstrap5mix_carouselAdvancedSettings.carouselClass.ui.tooltip=Pour les int\u00E9grateurs : classes CSS ajout\u00E9es au carrousel.
bootstrap5mix_carouselAdvancedSettings.variant.ui.tooltip=Couleur des fl\u00E8ches, des indicateurs et des l\u00E9gendes. Choisissez celle qui contraste avec vos images.
bootstrap5mix_figureAdvancedSettings.captionAlignment.ui.tooltip=Position de la l\u00E9gende sous l\u2019image.
bootstrap5mix_createSection_description=Entoure toute cette mise en page, avec tout ce qu\u2019elle contient, d\u2019un \u00E9l\u00E9ment HTML suppl\u00E9mentaire qui indique ce qu\u2019est cette partie de la page.
bootstrap5mix_createSection.sectionElement.ui.tooltip=La balise HTML plac\u00E9e autour de cette mise en page et de son contenu. Choisissez-la pour son sens : section pour une partie th\u00E9matique, article pour un contenu autonome, aside pour un contenu annexe, nav pour une navigation, header et footer pour le haut et le bas d\u2019un bloc, main pour le contenu principal de la page (un seul par page). Utilisez div quand aucun sens ne s\u2019applique.
bootstrap5mix_createSection.sectionStyle.ui.tooltip=Facultatif. Pour les int\u00E9grateurs : d\u00E9clarations CSS appliqu\u00E9es \u00E0 cet \u00E9l\u00E9ment seulement, par exemple background-color: #f5f5f5; padding-top: 2rem.
bootstrap5mix_createSection.sectionRole.ui.tooltip=Facultatif, pour les sp\u00E9cialistes de l\u2019accessibilit\u00E9. Le type d\u2019\u00E9l\u00E9ment choisi ci-dessus suffit en g\u00E9n\u00E9ral ; un r\u00F4le n\u2019est utile qu\u2019avec un div.
bootstrap5mix_createSection.sectionAria.ui.tooltip=Facultatif. Un nom court lu par les lecteurs d\u2019\u00E9cran pour distinguer cette partie de la page des autres, par exemple \u00AB Derni\u00E8res actualit\u00E9s \u00BB. Non affich\u00E9.
bootstrap5mix_createContainer_description=Centre le contenu et limite sa largeur. Sans conteneur, le contenu occupe toute la largeur disponible.
bootstrap5mix_createContainer.containerType.ui.tooltip=\u00AB Largeur fixe \u00BB centre le contenu et lui donne une largeur maximale qui grandit par paliers avec l\u2019\u00E9cran. \u00AB Fluide \u00BB occupe toujours toute la largeur. Les autres choix occupent toute la largeur sur les \u00E9crans plus \u00E9troits que la taille indiqu\u00E9e (un \u00AB point de rupture \u00BB), et une largeur fixe au-del\u00E0.
bootstrap5mix_createRow_description=D\u00E9coupe cette mise en page en colonnes plac\u00E9es c\u00F4te \u00E0 c\u00F4te. Sur petit \u00E9cran, les colonnes passent l\u2019une sous l\u2019autre.
bootstrap5mix_createRow.typeOfGrid.ui.tooltip=Ligne vide : une seule zone. Disposition pr\u00E9d\u00E9finie : choisissez parmi des largeurs de colonnes toutes faites. Disposition personnalis\u00E9e : d\u00E9finissez chaque colonne vous-m\u00EAme avec des classes Bootstrap.
bootstrap5mix_createRow.rowVerticalAlignment.ui.tooltip=Alignement des colonnes de hauteurs diff\u00E9rentes : \u00AB Haut \u00BB, \u00AB Milieu \u00BB ou \u00AB Bas \u00BB. \u00AB Par d\u00E9faut \u00BB leur donne \u00E0 toutes la hauteur de la plus haute.
bootstrap5mix_createRow.rowHorizontalAlignment.ui.tooltip=Position des colonnes quand, ensemble, elles sont moins larges que la rang\u00E9e. Sans effet visible quand les colonnes remplissent la rang\u00E9e, comme le font les dispositions pr\u00E9d\u00E9finies.
bootstrap5mix_createRow.horizontalGutters.ui.tooltip=\u00AB Aucune \u00BB : les colonnes se touchent. De 1 \u00E0 5 : un espace de plus en plus large. \u00AB Par d\u00E9faut \u00BB est l\u2019espace standard de Bootstrap (1,5rem, environ 24 pixels).
bootstrap5mix_createRow.verticalGutters.ui.tooltip=Espace entre les colonnes quand elles passent l\u2019une sous l\u2019autre, sur petit \u00E9cran par exemple. \u00AB Aucune \u00BB : pas d\u2019espace. De 1 \u00E0 5 : de plus en plus large. \u00AB Par d\u00E9faut \u00BB : pas d\u2019espace.
bootstrap5mix_predefinedGrid.grid.ui.tooltip=Chaque nombre est la largeur d\u2019une colonne ; une rang\u00E9e compl\u00E8te vaut 12. \u00AB 4 / 8 \u00BB est une colonne \u00E9troite suivie d\u2019une colonne deux fois plus large ; \u00AB 12 \u00BB est une colonne unique.
bootstrap5mix_createAbsoluteAreas_description=Les colonnes affichent un contenu enregistr\u00E9 sur une page plus haute dans l\u2019arborescence au lieu d\u2019un contenu propre : le m\u00EAme contenu appara\u00EEt sur toutes les pages situ\u00E9es sous cette page.
bootstrap5mix_createAbsoluteAreas.level.ui.tooltip=\u00AB 0 \u2014 Page d'accueil \u00BB est la page d\u2019accueil, 1 les pages plac\u00E9es directement dessous, et ainsi de suite. Le contenu se modifie sur cette page seulement ; sur les pages situ\u00E9es en dessous il est affich\u00E9 et ne peut pas \u00EAtre chang\u00E9.
bootstrap5mix_listLimit_description=Limite le nombre de contenus affich\u00E9s dans chaque colonne.
bootstrap5mix_listLimit.listLimit.ui.tooltip=Les contenus au-del\u00E0 de ce nombre ne sont pas affich\u00E9s, et les \u00E9diteurs ne peuvent pas en ajouter davantage. \u00AB Sans limite \u00BB affiche tout.
bootstrap5nt_navbar.root.ui.tooltip=La page dont les sous-pages forment le menu. Page d\u2019accueil : tout le site. Page courante : les pages sous la page affich\u00E9e. Page parente : les pages au m\u00EAme niveau que la page affich\u00E9e. Page personnalis\u00E9e : une page que vous choisissez.
bootstrap5mix_navbarGlobalSettings_description=Ce que contient la barre de navigation.
bootstrap5mix_navbarGlobalSettings.addLoginButton.ui.tooltip=Ajoute un bouton \u00AB Se connecter \u00BB ; une fois connect\u00E9, un menu avec le nom de l\u2019utilisateur et \u00AB Se d\u00E9connecter \u00BB.
bootstrap5mix_navbarGlobalSettings.addLanguageButton.ui.tooltip=Ajoute un menu pour lire la page dans une autre langue. Affich\u00E9 seulement si le site a au moins deux langues.
bootstrap5mix_navbarGlobalSettings.addColorModeButton.ui.tooltip=Ajoute un menu qui laisse les visiteurs choisir un affichage clair ou sombre, ou suivre le r\u00E9glage de leur appareil. Leur choix est m\u00E9moris\u00E9.
bootstrap5mix_navbarGlobalSettings.maxlevel.ui.tooltip=1 n\u2019affiche que le premier niveau de pages. 2 ajoute leurs sous-pages dans des menus d\u00E9roulants, 3 et plus ajoutent des sous-menus imbriqu\u00E9s.
bootstrap5mix_navbarGlobalSettings.addContainerWithinTheNavbar.ui.tooltip=Aligne le contenu de la barre sur celui de la page. D\u00E9cochez pour une barre dont le contenu occupe toute la largeur.
bootstrap5mix_customizeNavbar_description=Pour les int\u00E9grateurs : les classes CSS de chaque partie de la barre de navigation. Les champs vides utilisent les valeurs par d\u00E9faut de Bootstrap.
bootstrap5mix_customizeNavbar.navClass.ui.tooltip=D\u00E9finit les couleurs et la taille d\u2019\u00E9cran \u00E0 partir de laquelle le menu s\u2019affiche en entier : navbar-expand-lg le d\u00E9plie sur grand \u00E9cran. Pour une barre qui suit le mode sombre, utilisez bg-body-tertiary.
bootstrap5mix_brand_description=Nom et logo affich\u00E9s au d\u00E9but de cette barre de navigation. Ignor\u00E9 quand une marque est d\u00E9finie sur le site.
bootstrap5mix_brand.brandText.ui.tooltip=Affich\u00E9 \u00E0 c\u00F4t\u00E9 du logo. Avec un logo et sans texte, le nom du site d\u00E9crit le logo pour les personnes qui ne le voient pas.
bootstrap5mix_brand.brandImageMobile.ui.tooltip=Facultatif. Affich\u00E9 \u00E0 la place du logo de bureau tant que le menu est repli\u00E9.
bootstrap5mix_siteBrand_description=Nom et logo affich\u00E9s au d\u00E9but de toutes les barres de navigation du site. Remplace la marque d\u00E9finie sur chaque barre de navigation.
bootstrap5mix_siteBrand.brandText.ui.tooltip=Affich\u00E9 \u00E0 c\u00F4t\u00E9 du logo. Avec un logo et sans texte, le nom du site d\u00E9crit le logo pour les personnes qui ne le voient pas.
bootstrap5mix_siteBrand.brandImageMobile.ui.tooltip=Facultatif. Affich\u00E9 \u00E0 la place du logo de bureau tant que le menu est repli\u00E9.
bootstrap5mix_siteColorMode_description=Affichage clair ou sombre de tout le site.
bootstrap5mix_siteColorMode.colorMode.ui.tooltip=Le mode obtenu par les visiteurs qui n\u2019en ont pas choisi un avec le s\u00E9lecteur de la barre de navigation.
bootstrap5mix_customRootPage.customRootPage.ui.tooltip=Le menu liste les sous-pages de cette page.
bootstrap5nt_pagination.displayPager.ui.tooltip=D\u00E9coch\u00E9, la liste est toujours d\u00E9coup\u00E9e en pages mais les visiteurs n\u2019ont pas de liens vers les autres pages.
bootstrap5mix_advancedPagination.nbOfPages.ui.tooltip=Au-del\u00E0 de ce nombre, la barre n\u2019affiche que les pages autour de la page courante.
bootstrap5mix_advancedPagination.nbOfPagesInEdit.ui.tooltip=En \u00E9dition, la liste affiche ce nombre d\u2019\u00E9l\u00E9ments pour que vous puissiez tous les atteindre sans changer de page.
bootstrap5nt_progress.max.ui.tooltip=La barre est remplie en proportion : une valeur de 30 avec un maximum de 120 remplit un quart de la barre.
bootstrap5nt_progress.striped.ui.tooltip=Ajoute des rayures diagonales \u00E0 la partie remplie.
bootstrap5nt_tabs.type.ui.tooltip=Apparence de la barre d\u2019onglets. Chaque onglet est une liste de contenus ajout\u00E9e \u00E0 ce composant ; son titre est le texte de l\u2019onglet.
bootstrap5nt_tabs.align.ui.tooltip=Position des onglets dans la barre. \u00AB Remplissage \u00BB et \u00AB Justifi\u00E9 \u00BB les r\u00E9partissent sur toute la largeur : en proportion de leur texte, ou tous \u00E0 la m\u00EAme largeur.
bootstrap5nt_tabs.useListNameAsAnchor.ui.tooltip=L\u2019adresse de la page peut ouvrir un onglet pr\u00E9cis (\u2026#nom-de-la-liste). D\u00E9coch\u00E9, un identifiant technique remplace le nom.
bootstrap5mix_Offcanvas.placement.ui.tooltip=Bord de l\u2019\u00E9cran d\u2019o\u00F9 vient le panneau. \u00AB D\u00E9but \u00BB est la gauche et \u00AB Fin \u00BB la droite dans les langues lues de gauche \u00E0 droite (LTR) ; ils s\u2019inversent sinon.
bootstrap5mix_colors.textColor.ui.tooltip=\u00AB Body \u00BB est la couleur normale du texte du site ; \u00AB Att\u00E9nu\u00E9 \u00BB un gris plus clair pour un texte secondaire. V\u00E9rifiez que le texte reste lisible sur le fond choisi.
bootstrap5mix_colors.backgroundColor.ui.tooltip=\u00AB Par d\u00E9faut \u00BB conserve le fond standard d\u2019une carte.
bootstrap5mix_modal.modalSize.ui.tooltip=Largeur de la fen\u00EAtre sur grand \u00E9cran. Sur t\u00E9l\u00E9phone elle occupe toujours la largeur de l\u2019\u00E9cran.
bootstrap5mix_advancedPagination.align.ui.tooltip=Position de la barre de pagination dans la largeur de son conteneur.
bootstrap5nt_card.textAlign.ui.tooltip=Alignement du texte de toute la carte. \u00AB D\u00E9but \u00BB est la gauche dans les langues lues de gauche \u00E0 droite.
