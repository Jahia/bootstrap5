bootstrap5mix_carouselAdvancedSettings.variant=Colore dei controlli
bootstrap5mix_carouselAdvancedSettings.variant.white=White (per immagini scure)
bootstrap5mix_carouselAdvancedSettings.variant.dark=Dark (per immagini chiare)
bootstrap5nt_carouselItem.image=Immagine
bootstrap5nt_carouselItem.jcr_title=Titolo della diapositiva
bootstrap5nt_accordion.jcr_title=Titolo del pannello
bootstrap5nt_button.jcr_title=Testo del pulsante
bootstrap5nt_card.jcr_title=Titolo della card
bootstrap5nt_carouselItem.jcr_title.ui.tooltip=Mostrato sopra l\u2019immagine e letto alle persone che non possono vederla.
bootstrap5nt_accordion.jcr_title.ui.tooltip=L\u2019intestazione cliccabile che apre e chiude il pannello.
bootstrap5nt_button.jcr_title.ui.tooltip=Il testo mostrato dal pulsante. Se il campo \u00E8 vuoto, un pulsante con collegamento interno mostra il titolo della pagina di destinazione. Gli altri pulsanti mostrano \u00ABLeggi di pi\u00F9\u00BB.
bootstrap5nt_card.jcr_title.ui.tooltip=Mostrato nell\u2019intestazione della card. Lasciare vuoto per una card senza intestazione.
bootstrap5nt_figure.jcr_title.ui.tooltip=Breve testo mostrato sotto l\u2019immagine.
bootstrap5nt_buttonGroup.jcr_title.ui.tooltip=Non visualizzato. Indica agli utenti di screen reader che cosa hanno in comune i pulsanti, ad esempio \u00ABCondividi\u00BB.
bootstrap5mix_padding_description=Spazio all\u2019interno del componente, tra il bordo e il contenuto.
bootstrap5mix_padding.paddingWhere.ui.tooltip=Lati che ricevono lo spazio. \u00ABInizio\u00BB e \u00ABFine\u00BB sono la sinistra e la destra nelle lingue lette da sinistra a destra, e si invertono nelle lingue lette da destra a sinistra.
bootstrap5mix_padding.paddingSize.ui.tooltip=Da 0 (nessuno) a 5 (il pi\u00F9 grande). Un rem \u00E8 la dimensione del testo di base, di solito 16 pixel: \u00AB3 \u2014 1rem\u00BB corrisponde all\u2019altezza di una riga di testo.
bootstrap5mix_margin_description=Spazio all\u2019esterno del componente, tra questo e gli elementi vicini.
bootstrap5mix_margin.marginWhere.ui.tooltip=Lati che ricevono lo spazio. \u00ABInizio\u00BB e \u00ABFine\u00BB sono la sinistra e la destra nelle lingue lette da sinistra a destra, e si invertono nelle lingue lette da destra a sinistra.
bootstrap5mix_margin.marginSize.ui.tooltip=Da 0 (nessuno) a 5 (il pi\u00F9 grande). Un rem \u00E8 la dimensione del testo di base, di solito 16 pixel: \u00AB3 \u2014 1rem\u00BB corrisponde all\u2019altezza di una riga di testo.
bootstrap5mix_imageAdvancedSettings_description=Impostazioni facoltative per la visualizzazione dell\u2019immagine.
bootstrap5mix_imageAdvancedSettings.imageClass.ui.tooltip=Per gli integratori: classi CSS aggiunte all\u2019immagine, separate da spazi.
bootstrap5mix_imageAdvancedSettings.imageStyle.ui.tooltip=Per gli integratori: dichiarazioni CSS applicate solo a questa immagine, ad esempio max-width: 300px.
bootstrap5mix_imageAdvancedSettings.imageID.ui.tooltip=Per gli integratori: identificatore che permette a un collegamento, a uno script o a un foglio di stile di fare riferimento a questa immagine. Deve essere univoco nella pagina.
bootstrap5mix_imageAdvancedSettings.responsive.ui.tooltip=L\u2019immagine si riduce insieme al contenitore e non ne esce mai. Deselezionare solo per un\u2019immagine che deve mantenere la dimensione esatta.
bootstrap5mix_imageAdvancedSettings.thumbnails.ui.tooltip=Aggiunge un bordo sottile e un piccolo margine attorno all\u2019immagine.
bootstrap5mix_imageAdvancedSettings.align.ui.tooltip=\u00ABInizio\u00BB e \u00ABFine\u00BB mettono l\u2019immagine su un lato e lasciano scorrere il testo intorno (LTR indica una lingua letta da sinistra a destra; altrimenti i lati si invertono). \u00ABCentro\u00BB mette l\u2019immagine da sola sulla sua riga.
bootstrap5mix_imageAdvancedSettings.alt.ui.tooltip=Descrive l\u2019immagine alle persone che non possono vederla. Se vuoto, viene usato il titolo del file dell\u2019immagine.
bootstrap5mix_imageAdvancedSettings.borderRadius.ui.tooltip=Angoli da arrotondare. \u00ABCerchio\u00BB e \u00ABPillola\u00BB ignorano la dimensione qui sotto. \u00ABNessuno\u00BB lascia gli angoli squadrati.
bootstrap5mix_imageAdvancedSettings.borderRadiusSize.ui.tooltip=Quanto sono arrotondati gli angoli scelti. \u00ABPredefinita\u00BB \u00E8 l\u2019arrotondamento standard di Bootstrap.
bootstrap5nt_accordion.show.ui.tooltip=Il pannello \u00E8 aperto al caricamento della pagina. L\u2019apertura di un altro pannello lo chiude.
bootstrap5nt_accordions.flush.ui.tooltip=Per un accordion che tocca i bordi del contenitore, ad esempio in una card o in una barra laterale.
bootstrap5mix_alert_description=Mostra questo contenuto in un riquadro colorato che attira l\u2019attenzione.
bootstrap5mix_alert.backgroundColor.ui.tooltip=Il colore ha un significato: \u00ABSuccess\u00BB \u00E8 verde, \u00ABWarning\u00BB giallo, \u00ABDanger\u00BB rosso, \u00ABInfo\u00BB azzurro. Dirlo anche nel testo: il colore da solo non \u00E8 percepito da tutti. \u00ABCollegamento\u00BB e \u00ABPersonalizzato\u00BB hanno effetto solo se il foglio di stile del sito li definisce.
bootstrap5mix_alert.addDismissButton.ui.tooltip=I visitatori possono chiudere il riquadro. Ricompare quando la pagina viene ricaricata.
bootstrap5mix_advancedBreadcrumb.cssClass.ui.tooltip=Per gli integratori: classi CSS aggiunte all\u2019elenco del percorso di navigazione, separate da spazi.
bootstrap5nt_button.buttonType.ui.tooltip=Che cosa succede quando si fa clic sul pulsante. Le impostazioni dell\u2019azione scelta compaiono qui sotto.
bootstrap5mix_buttonAdvancedSettings_description=Aspetto del pulsante.
bootstrap5mix_buttonAdvancedSettings.style.ui.tooltip=Colore del pulsante. \u00ABPrimary\u00BB serve per l\u2019azione principale della pagina; usarlo una sola volta. \u00ABSenza sfondo\u00BB sembra un semplice collegamento. \u00ABPersonalizzato\u00BB rimuove le classi Bootstrap e usa solo il campo della classe CSS.
bootstrap5mix_buttonAdvancedSettings.outline.ui.tooltip=Bordo e testo colorati su sfondo trasparente, per un pulsante meno in evidenza.
bootstrap5mix_buttonAdvancedSettings.block.ui.tooltip=Il pulsante occupa tutta la larghezza del contenitore.
bootstrap5mix_buttonAdvancedSettings.state.ui.tooltip=\u00ABAttivo\u00BB mostra il pulsante come premuto. \u00ABDisabilitato\u00BB lo rende grigio e non pi\u00F9 cliccabile.
bootstrap5mix_buttonAdvancedSettings.cssClass.ui.tooltip=Per gli integratori: classi CSS aggiunte al pulsante. Con lo stile \u00ABPersonalizzato\u00BB sono le uniche classi del pulsante.
bootstrap5mix_buttonAdvancedSettings.disableTextWrapping.ui.tooltip=Il testo resta su una sola riga, anche in un contenitore stretto.
bootstrap5mix_buttonAdvancedSettings.stretchedLink.ui.tooltip=Un clic in qualsiasi punto del blocco che contiene il pulsante, ad esempio una card, apre il collegamento.
bootstrap5mix_buttonAdvancedSettings.tooltip.ui.tooltip=Breve testo mostrato quando si passa il puntatore sul pulsante o quando si raggiunge il pulsante con la tastiera. Su uno schermo tattile il testo potrebbe non comparire mai: non inserirvi informazioni essenziali.
bootstrap5mix_collapse_description=Il pulsante mostra e nasconde il contenuto aggiunto sotto di esso nella pagina.
bootstrap5mix_collapse.show.ui.tooltip=Il contenuto \u00E8 visibile al caricamento della pagina.
bootstrap5mix_internalLink_description=Il pulsante apre una pagina o un file di questo sito.
bootstrap5mix_externalLink_description=Il pulsante apre un indirizzo esterno a questo sito.
bootstrap5mix_externalLink.externalLink.ui.tooltip=Indirizzo completo che inizia con https://. Funzionano anche un indirizzo e-mail (mailto:) o un numero di telefono (tel:).
bootstrap5mix_modal_description=Il pulsante apre una finestra sopra la pagina. Aggiungere il contenuto della finestra dalla pagina, all\u2019interno del pulsante.
bootstrap5mix_modal.modalTitle.ui.tooltip=Mostrato nella parte superiore della finestra. Senza titolo, la finestra non ha n\u00E9 intestazione n\u00E9 croce di chiusura.
bootstrap5mix_modal.closeText.ui.tooltip=Testo del pulsante nella parte inferiore della finestra. Se vuoto, \u00ABChiudi\u00BB.
bootstrap5mix_modal.staticBackdrop.ui.tooltip=La finestra si chiude solo con i propri pulsanti, per un contenuto che deve essere letto.
bootstrap5mix_modal.verticallyCentered.ui.tooltip=Centra la finestra in verticale sullo schermo invece di collocarla in alto.
bootstrap5mix_popover_description=Il pulsante mostra un piccolo fumetto accanto a s\u00E9. Un clic altrove lo chiude.
bootstrap5mix_popover.direction.ui.tooltip=Lato del pulsante su cui compare il fumetto. Si sposta su un altro lato quando lo spazio non basta.
bootstrap5mix_popover.html.ui.tooltip=Il contenuto viene interpretato come HTML anzich\u00E9 come testo semplice. Selezionare solo per i contenuti che si sono scritti in prima persona.
bootstrap5mix_Offcanvas_description=Il pulsante apre un pannello che scorre da un bordo dello schermo. Aggiungere il contenuto del pannello dalla pagina, all\u2019interno del pulsante.
bootstrap5mix_Offcanvas.OffcanvasTitle.ui.tooltip=Mostrato nella parte superiore del pannello, accanto alla croce di chiusura.
bootstrap5mix_Offcanvas.enableBackdrop.ui.tooltip=Scurisce la pagina dietro il pannello; un clic sulla pagina scurita chiude il pannello.
bootstrap5mix_Offcanvas.enableBodyScrolling.ui.tooltip=\u00C8 ancora possibile scorrere la pagina dietro il pannello.
bootstrap5nt_buttonGroup.vertical.ui.tooltip=I pulsanti sono disposti uno sotto l\u2019altro anzich\u00E9 affiancati.
bootstrap5nt_card.headerSize.ui.tooltip=Livello del titolo nella struttura della pagina (H2 sotto il titolo della pagina, H3 sotto un H2\u2026). Non cambia la dimensione del testo. \u00ABPredefinito\u00BB \u00E8 un semplice paragrafo, non un titolo.
bootstrap5nt_card.footer.ui.tooltip=Breve testo mostrato in fondo alla card. Per un contenuto pi\u00F9 ricco, selezionare \u00ABPi\u00E8 di pagina avanzato\u00BB nelle impostazioni avanzate.
bootstrap5mix_colors_description=Colori della card. Verificare che il testo resti leggibile sullo sfondo scelto.
bootstrap5mix_cardAdvancedSettings.cssClass.ui.tooltip=Per gli integratori: sostituisce la classe \u00ABcard\u00BB del blocco esterno. Mantenere \u00ABcard\u00BB, a meno di ridefinire interamente lo stile della card.
bootstrap5mix_cardAdvancedSettings.cardHeaderCssClass.ui.tooltip=Per gli integratori: sostituisce la classe \u00ABcard-header\u00BB dell\u2019intestazione.
bootstrap5mix_cardAdvancedSettings.cardBodyCssClass.ui.tooltip=Per gli integratori: sostituisce la classe \u00ABcard-body\u00BB del corpo.
bootstrap5mix_cardAdvancedSettings.freeFooter.ui.tooltip=Sostituisce il testo del pi\u00E8 di pagina con un\u2019area in cui \u00E8 possibile aggiungere qualsiasi contenuto dalla pagina.
bootstrap5nt_carouselItem.image.ui.tooltip=Usare immagini con le stesse proporzioni per tutte le diapositive, altrimenti il carosello cambia altezza da una diapositiva all\u2019altra.
bootstrap5nt_carouselItem.caption.ui.tooltip=Mostrata sopra l\u2019immagine, sotto il titolo.
bootstrap5mix_advancedCarouselItem.titleColor.ui.tooltip=Scegliere un colore che resti leggibile sopra l\u2019immagine.
bootstrap5mix_advancedCarouselItem.captionColor.ui.tooltip=Scegliere un colore che resti leggibile sopra l\u2019immagine.
bootstrap5mix_advancedCarouselItem.carouselItemClass.ui.tooltip=Per gli integratori: classi CSS aggiunte a questa diapositiva.
bootstrap5mix_advancedCarouselItem.interval.ui.tooltip=Durata di visualizzazione di questa diapositiva, in millisecondi (5000 = 5 secondi). Se il campo \u00E8 vuoto, si usa la durata di visualizzazione impostata per il carosello.
bootstrap5mix_carouselAdvancedSettings_description=Comportamento e controlli del carosello.
bootstrap5mix_carouselAdvancedSettings.useIndicators.ui.tooltip=Piccole barre in basso, una per diapositiva, per passare direttamente a una diapositiva.
bootstrap5mix_carouselAdvancedSettings.interval.ui.tooltip=In millisecondi: 5000 = 5 secondi, il valore predefinito.
bootstrap5mix_carouselAdvancedSettings.keyboard.ui.tooltip=I tasti freccia sinistra e destra cambiano diapositiva quando si raggiunge il carosello con la tastiera.
bootstrap5mix_carouselAdvancedSettings.pause.ui.tooltip=Le diapositive smettono di scorrere finch\u00E9 il puntatore \u00E8 sul carosello.
bootstrap5mix_carouselAdvancedSettings.ride.ui.tooltip=Le diapositive scorrono da sole. Viene aggiunto un pulsante di pausa per chi usa la tastiera o uno screen reader. Se deselezionato, sono i visitatori a cambiare diapositiva.
bootstrap5mix_carouselAdvancedSettings.wrap.ui.tooltip=Dopo l\u2019ultima diapositiva, il carosello riparte dalla prima.
bootstrap5mix_carouselAdvancedSettings.fade.ui.tooltip=Una diapositiva sfuma nella successiva invece di scorrere lateralmente.
bootstrap5mix_carouselAdvancedSettings.carouselClass.ui.tooltip=Per gli integratori: classi CSS aggiunte al carosello.
bootstrap5mix_carouselAdvancedSettings.variant.ui.tooltip=Colore delle frecce, degli indicatori e delle didascalie. Scegliere quello che contrasta con le immagini.
bootstrap5mix_figureAdvancedSettings.captionAlignment.ui.tooltip=Posizione della didascalia sotto l\u2019immagine.
bootstrap5mix_createSection_description=Racchiude l\u2019intero layout, con tutto ci\u00F2 che contiene, in un elemento HTML aggiuntivo che indica che cos\u2019\u00E8 questa parte della pagina.
bootstrap5mix_createSection.sectionElement.ui.tooltip=Il tag HTML posto attorno a questo layout e al suo contenuto. Sceglierlo in base al significato: section per una parte tematica, article per un contenuto autonomo, aside per un contenuto accessorio, nav per una navigazione, header e footer per la parte superiore e inferiore di un blocco, main per il contenuto principale della pagina (uno solo per pagina). Usare div quando nessun significato \u00E8 adatto.
bootstrap5mix_createSection.sectionStyle.ui.tooltip=Facoltativo. Per gli integratori: dichiarazioni CSS applicate solo a questo elemento, ad esempio background-color: #f5f5f5; padding-top: 2rem.
bootstrap5mix_createSection.sectionRole.ui.tooltip=Facoltativo, per gli specialisti di accessibilit\u00E0. Il tipo di elemento scelto sopra di solito \u00E8 sufficiente; indicare un ruolo \u00E8 utile solo se si sceglie div.
bootstrap5mix_createSection.sectionAria.ui.tooltip=Facoltativo. Un nome breve letto dagli screen reader per distinguere questa parte della pagina dalle altre, ad esempio \u00ABUltime notizie\u00BB. Non visualizzato.
bootstrap5mix_createContainer_description=Centra il contenuto e ne limita la larghezza. Senza contenitore, il contenuto occupa tutta la larghezza disponibile.
bootstrap5mix_createContainer.containerType.ui.tooltip=\u00ABLarghezza fissa\u00BB centra il contenuto e gli d\u00E0 una larghezza massima che aumenta a intervalli prestabiliti in base alla larghezza dello schermo. \u00ABFluido\u00BB occupa sempre tutta la larghezza. Con le altre opzioni, il contenuto occupa tutta la larghezza sugli schermi pi\u00F9 stretti della soglia indicata. A partire da quella soglia, detta breakpoint, la larghezza del contenuto \u00E8 fissa.
bootstrap5mix_createRow_description=Suddivide questo layout in colonne affiancate. Sugli schermi piccoli le colonne si dispongono una sotto l\u2019altra.
bootstrap5mix_createRow.typeOfGrid.ui.tooltip=\u00ABRiga vuota\u00BB: una sola area. \u00ABDisposizione predefinita\u00BB: scegliere tra larghezze di colonna gi\u00E0 pronte. \u00ABDisposizione personalizzata\u00BB: definire ogni colonna con le classi Bootstrap.
bootstrap5mix_createRow.rowVerticalAlignment.ui.tooltip=Allineamento delle colonne di altezze diverse: \u00ABAlto\u00BB, \u00ABMedio\u00BB o \u00ABBasso\u00BB. \u00ABPredefinito\u00BB d\u00E0 a tutte l\u2019altezza della pi\u00F9 alta.
bootstrap5mix_createRow.rowHorizontalAlignment.ui.tooltip=Posizione delle colonne quando, insieme, sono pi\u00F9 strette della riga. Nessun effetto visibile quando le colonne riempiono la riga, come nelle disposizioni predefinite.
bootstrap5mix_createRow.horizontalGutters.ui.tooltip=\u00ABNessuno\u00BB: le colonne si toccano. Da 1 a 5: uno spazio sempre pi\u00F9 ampio. \u00ABPredefinito\u00BB \u00E8 lo spazio standard di Bootstrap (1,5rem, circa 24 pixel).
bootstrap5mix_createRow.verticalGutters.ui.tooltip=Spazio tra le colonne quando vanno una sotto l\u2019altra, per esempio su schermi piccoli. \u00ABNessuno\u00BB: nessuno spazio. Da 1 a 5: sempre pi\u00F9 ampio. \u00ABPredefinito\u00BB: nessuno spazio.
bootstrap5mix_predefinedGrid.grid.ui.tooltip=Ogni numero \u00E8 la larghezza di una colonna; una riga completa vale 12. \u00AB4 / 8\u00BB \u00E8 una colonna stretta seguita da una larga il doppio; \u00AB12\u00BB \u00E8 un\u2019unica colonna.
bootstrap5mix_createAbsoluteAreas_description=Le colonne mostrano un contenuto salvato in una pagina pi\u00F9 in alto nell\u2019albero del sito invece di un contenuto proprio: lo stesso contenuto compare in tutte le pagine sotto quella pagina.
bootstrap5mix_createAbsoluteAreas.level.ui.tooltip=\u00AB0 \u2014 Home page\u00BB \u00E8 la home page, 1 le pagine poste direttamente sotto, e cos\u00EC via. Il contenuto si modifica solo in quella pagina; nelle pagine sottostanti \u00E8 visualizzato e non pu\u00F2 essere cambiato.
bootstrap5mix_listLimit_description=Limita il numero di contenuti mostrati in ogni colonna.
bootstrap5mix_listLimit.listLimit.ui.tooltip=I contenuti oltre questo numero non vengono visualizzati, e i redattori non possono aggiungerne altri. \u00ABNessun limite\u00BB mostra tutto.
bootstrap5nt_navbar.root.ui.tooltip=La pagina le cui sottopagine formano il menu. \u00ABHome page\u00BB: tutto il sito. \u00ABPagina corrente\u00BB: le pagine sotto la pagina visualizzata. \u00ABPagina padre\u00BB: le pagine allo stesso livello della pagina visualizzata. \u00ABPagina personalizzata\u00BB: una pagina a scelta.
bootstrap5mix_navbarGlobalSettings_description=Contenuto della barra di navigazione.
bootstrap5mix_navbarGlobalSettings.addLoginButton.ui.tooltip=Aggiunge un pulsante \u00ABAccedi\u00BB; dopo l\u2019accesso, un menu con il nome dell\u2019utente e \u00ABEsci\u00BB.
bootstrap5mix_navbarGlobalSettings.addLanguageButton.ui.tooltip=Aggiunge un menu per leggere la pagina in un\u2019altra lingua. Mostrato solo se il sito ha almeno due lingue.
bootstrap5mix_navbarGlobalSettings.addColorModeButton.ui.tooltip=Aggiunge un menu che consente ai visitatori di scegliere una visualizzazione chiara o scura, oppure di seguire l\u2019impostazione del dispositivo. La scelta viene memorizzata.
bootstrap5mix_navbarGlobalSettings.maxlevel.ui.tooltip=1 mostra solo il primo livello di pagine. Con 2, si aggiungono le relative sottopagine nei menu a discesa. Con 3 o pi\u00F9, compaiono sottomenu su pi\u00F9 livelli.
bootstrap5mix_navbarGlobalSettings.addContainerWithinTheNavbar.ui.tooltip=Allinea il contenuto della barra a quello della pagina. Deselezionare per una barra il cui contenuto occupa tutta la larghezza.
bootstrap5mix_customizeNavbar_description=Per gli integratori: le classi CSS di ogni parte della barra di navigazione. I campi vuoti usano i valori predefiniti di Bootstrap.
bootstrap5mix_customizeNavbar.navClass.ui.tooltip=Definisce i colori e la dimensione di schermo a partire dalla quale il menu \u00E8 mostrato per intero: navbar-expand-lg lo espande sugli schermi grandi. Per una barra che segue la modalit\u00E0 scura, usare bg-body-tertiary.
bootstrap5mix_brand_description=Nome e logo mostrati all\u2019inizio di questa barra di navigazione. Ignorato quando \u00E8 definito un marchio sul sito.
bootstrap5mix_brand.brandText.ui.tooltip=Mostrato accanto al logo. Con un logo e senza testo, il nome del sito descrive il logo per le persone che non possono vederlo.
bootstrap5mix_brand.brandImageMobile.ui.tooltip=Facoltativo. Mostrato al posto del logo desktop finch\u00E9 il menu \u00E8 chiuso.
bootstrap5mix_siteBrand_description=Nome e logo mostrati all\u2019inizio di tutte le barre di navigazione del sito. Sostituisce il marchio definito su ogni barra di navigazione.
bootstrap5mix_siteBrand.brandText.ui.tooltip=Mostrato accanto al logo. Con un logo e senza testo, il nome del sito descrive il logo per le persone che non possono vederlo.
bootstrap5mix_siteBrand.brandImageMobile.ui.tooltip=Facoltativo. Mostrato al posto del logo desktop finch\u00E9 il menu \u00E8 chiuso.
bootstrap5mix_siteColorMode_description=Visualizzazione chiara o scura dell\u2019intero sito.
bootstrap5mix_siteColorMode.colorMode.ui.tooltip=La modalit\u00E0 applicata ai visitatori che non ne hanno scelta una con il selettore della barra di navigazione.
bootstrap5mix_customRootPage.customRootPage.ui.tooltip=Il menu elenca le sottopagine di questa pagina.
bootstrap5nt_pagination.displayPager.ui.tooltip=Se deselezionato, l\u2019elenco resta suddiviso in pagine ma i visitatori non hanno collegamenti alle altre pagine.
bootstrap5mix_advancedPagination.nbOfPages.ui.tooltip=Oltre questo numero, la barra mostra solo le pagine vicine a quella corrente.
bootstrap5mix_advancedPagination.nbOfPagesInEdit.ui.tooltip=In modalit\u00E0 modifica, l\u2019elenco mostra questo numero di elementi, cos\u00EC da poterli raggiungere tutti senza cambiare pagina.
bootstrap5nt_progress.max.ui.tooltip=La parte riempita dipende dal rapporto tra il valore e il massimo. Con un valore di 30 e un massimo di 120, si riempie un quarto della barra.
bootstrap5nt_progress.striped.ui.tooltip=Aggiunge strisce diagonali alla parte riempita.
bootstrap5nt_tabs.type.ui.tooltip=Aspetto della barra delle schede. Ogni scheda della barra corrisponde a un elenco di contenuti aggiunto a questo componente. Il titolo dell\u2019elenco \u00E8 il testo della scheda nella barra.
bootstrap5nt_tabs.align.ui.tooltip=Posizione delle schede nella barra. Entrambe le opzioni occupano tutta la larghezza della barra. Con \u00ABRiempi\u00BB, la larghezza di ogni scheda dipende dalla lunghezza del testo. Con \u00ABGiustificato\u00BB, tutte le schede hanno la stessa larghezza.
bootstrap5nt_tabs.useListNameAsAnchor.ui.tooltip=L\u2019indirizzo della pagina pu\u00F2 aprire una scheda specifica (\u2026#nome-dell-elenco). Se deselezionato, al posto del nome viene usato un identificatore tecnico.
bootstrap5mix_Offcanvas.placement.ui.tooltip=Bordo dello schermo da cui entra il pannello. \u00ABInizio\u00BB \u00E8 la sinistra e \u00ABFine\u00BB la destra nelle lingue lette da sinistra a destra (LTR); altrimenti si invertono.
bootstrap5mix_colors.textColor.ui.tooltip=\u00ABBody\u00BB \u00E8 il colore normale del testo del sito; \u00ABAttenuato\u00BB un grigio pi\u00F9 chiaro per un testo secondario. Verificare che il testo resti leggibile sullo sfondo scelto.
bootstrap5mix_colors.backgroundColor.ui.tooltip=\u00ABPredefinito\u00BB mantiene lo sfondo standard di una card.
bootstrap5mix_modal.modalSize.ui.tooltip=Larghezza della finestra sugli schermi grandi. Su un telefono occupa sempre la larghezza dello schermo.
bootstrap5mix_advancedPagination.align.ui.tooltip=Posizione della barra di paginazione nella larghezza del suo contenitore.
bootstrap5nt_card.textAlign.ui.tooltip=Allineamento del testo di tutta la card. \u00ABInizio\u00BB \u00E8 la sinistra nelle lingue lette da sinistra a destra.
