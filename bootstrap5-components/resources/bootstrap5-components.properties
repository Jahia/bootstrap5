# Help texts shown in the content editor (field: .ui.tooltip, group of fields: _description)
bootstrap5mix_carouselAdvancedSettings.variant=Colour of the controls
bootstrap5mix_carouselAdvancedSettings.variant.white=White (for dark images)
bootstrap5mix_carouselAdvancedSettings.variant.dark=Dark (for light images)
bootstrap5nt_carouselItem.image=Image
bootstrap5nt_carouselItem.jcr_title=Slide title
bootstrap5nt_accordion.jcr_title=Panel title
bootstrap5nt_button.jcr_title=Button text
bootstrap5nt_card.jcr_title=Card title
bootstrap5nt_carouselItem.jcr_title.ui.tooltip=Shown over the image, and read to people who cannot see it.
bootstrap5nt_accordion.jcr_title.ui.tooltip=The clickable heading that opens and closes the panel.
bootstrap5nt_button.jcr_title.ui.tooltip=What the button says. If empty, an internal link shows the title of its target page, the other buttons show \u201CRead more\u201D.
bootstrap5nt_card.jcr_title.ui.tooltip=Shown in the header of the card. Leave empty for a card without header.
bootstrap5nt_figure.jcr_title.ui.tooltip=Short text shown under the image.
bootstrap5nt_buttonGroup.jcr_title.ui.tooltip=Not displayed. Tells screen reader users what the buttons have in common, for example \u201CShare\u201D.
bootstrap5mix_padding_description=Space inside the component, between its edge and its content.
bootstrap5mix_padding.paddingWhere.ui.tooltip=Which sides get the space. \u201CStart\u201D and \u201CEnd\u201D are the left and the right in languages read from left to right, and swap in languages read from right to left.
bootstrap5mix_padding.paddingSize.ui.tooltip=From 0 (none) to 5 (largest). A rem is the size of the base text, usually 16 pixels: \u201C3 \u2014 1rem\u201D is one line of text high.
bootstrap5mix_margin_description=Space outside the component, between it and its neighbours.
bootstrap5mix_margin.marginWhere.ui.tooltip=Which sides get the space. \u201CStart\u201D and \u201CEnd\u201D are the left and the right in languages read from left to right, and swap in languages read from right to left.
bootstrap5mix_margin.marginSize.ui.tooltip=From 0 (none) to 5 (largest). A rem is the size of the base text, usually 16 pixels: \u201C3 \u2014 1rem\u201D is one line of text high.
bootstrap5mix_imageAdvancedSettings_description=Optional settings for the way the image is displayed.
bootstrap5mix_imageAdvancedSettings.imageClass.ui.tooltip=For integrators: CSS classes added to the image, separated by spaces.
bootstrap5mix_imageAdvancedSettings.imageStyle.ui.tooltip=For integrators: CSS declarations applied to this image only, for example max-width: 300px.
bootstrap5mix_imageAdvancedSettings.imageID.ui.tooltip=For integrators: identifier used to target this image from a link, a script or a style sheet. Must be unique on the page.
bootstrap5mix_imageAdvancedSettings.responsive.ui.tooltip=The image shrinks with its container and never overflows it. Untick only for an image that must keep its exact size.
bootstrap5mix_imageAdvancedSettings.thumbnails.ui.tooltip=Adds a thin border and a small margin around the image.
bootstrap5mix_imageAdvancedSettings.align.ui.tooltip=\u201CStart\u201D and \u201CEnd\u201D put the image on one side and let the text flow around it (LTR means a language read from left to right; the sides swap otherwise). \u201CCenter\u201D puts the image alone on its line.
bootstrap5mix_imageAdvancedSettings.alt.ui.tooltip=Describes the image to people who cannot see it. If empty, the title of the image file is used.
bootstrap5mix_imageAdvancedSettings.borderRadius.ui.tooltip=Which corners are rounded. \u201CCircle\u201D and \u201CPill\u201D ignore the size below. \u201CNone\u201D leaves square corners.
bootstrap5mix_imageAdvancedSettings.borderRadiusSize.ui.tooltip=How round the chosen corners are. \u201CDefault\u201D is the standard rounding of Bootstrap.
bootstrap5nt_accordion.show.ui.tooltip=The panel is open when the page loads. Opening another panel closes it.
bootstrap5nt_accordions.flush.ui.tooltip=For an accordion that touches the edges of its container, in a card or a sidebar for example.
bootstrap5mix_alert_description=Displays this content in a coloured box that draws attention.
bootstrap5mix_alert.backgroundColor.ui.tooltip=The colour carries a meaning: \u201CSuccess\u201D is green, \u201CWarning\u201D yellow, \u201CDanger\u201D red, \u201CInfo\u201D light blue. Say it in the text too, colour alone is not perceived by everyone. \u201CLink\u201D and \u201CCustom\u201D only have an effect if the style sheet of your site defines them.
bootstrap5mix_alert.addDismissButton.ui.tooltip=Visitors can close the box. It comes back when the page is loaded again.
bootstrap5mix_advancedBreadcrumb.cssClass.ui.tooltip=For integrators: CSS classes added to the breadcrumb list, separated by spaces.
bootstrap5nt_button.buttonType.ui.tooltip=What happens when the button is clicked. The settings of the chosen action appear below.
bootstrap5mix_buttonAdvancedSettings_description=Appearance of the button.
bootstrap5mix_buttonAdvancedSettings.style.ui.tooltip=Colour of the button. \u201CPrimary\u201D is for the main action of the page; use it once. \u201CNo background\u201D looks like a plain link. \u201CCustom\u201D removes the Bootstrap classes and uses the CSS class field only.
bootstrap5mix_buttonAdvancedSettings.outline.ui.tooltip=Coloured border and text on a transparent background, for a less prominent button.
bootstrap5mix_buttonAdvancedSettings.block.ui.tooltip=The button takes the whole width of its container.
bootstrap5mix_buttonAdvancedSettings.state.ui.tooltip=\u201CActive\u201D shows the button as pressed. \u201CDisabled\u201D greys it out and it can no longer be clicked.
bootstrap5mix_buttonAdvancedSettings.cssClass.ui.tooltip=For integrators: CSS classes added to the button. With the \u201CCustom\u201D style, they are the only classes of the button.
bootstrap5mix_buttonAdvancedSettings.disableTextWrapping.ui.tooltip=The text stays on one line, even in a narrow container.
bootstrap5mix_buttonAdvancedSettings.stretchedLink.ui.tooltip=Clicking anywhere in the block that contains the button, a card for example, follows the link.
bootstrap5mix_buttonAdvancedSettings.tooltip.ui.tooltip=Small text shown when the button is pointed at or focused. Touch screen users may never see it: do not put essential information in it.
bootstrap5mix_collapse_description=The button shows and hides the content you add under it on the page.
bootstrap5mix_collapse.show.ui.tooltip=The content is visible when the page loads.
bootstrap5mix_internalLink_description=The button opens a page or a file of this site.
bootstrap5mix_externalLink_description=The button opens an address outside this site.
bootstrap5mix_externalLink.externalLink.ui.tooltip=Full address starting with https://. An e-mail (mailto:) or a phone number (tel:) also work.
bootstrap5mix_modal_description=The button opens a window over the page. Add the content of the window from the page, inside the button.
bootstrap5mix_modal.modalTitle.ui.tooltip=Shown at the top of the window. Without title, the window has no header and no close cross.
bootstrap5mix_modal.closeText.ui.tooltip=Text of the button at the bottom of the window. \u201CClose\u201D if empty.
bootstrap5mix_modal.staticBackdrop.ui.tooltip=The window only closes with its own buttons, for content that must be read.
bootstrap5mix_modal.verticallyCentered.ui.tooltip=Centres the window in the height of the screen instead of placing it at the top.
bootstrap5mix_popover_description=The button shows a small bubble next to it. Clicking elsewhere closes it.
bootstrap5mix_popover.direction.ui.tooltip=Side of the button where the bubble appears. It moves to another side when there is not enough room.
bootstrap5mix_popover.html.ui.tooltip=The content is interpreted as HTML instead of plain text. Only tick it for content you wrote yourself.
bootstrap5mix_Offcanvas_description=The button opens a panel that slides in from an edge of the screen. Add the content of the panel from the page, inside the button.
bootstrap5mix_Offcanvas.OffcanvasTitle.ui.tooltip=Shown at the top of the panel, next to the close cross.
bootstrap5mix_Offcanvas.enableBackdrop.ui.tooltip=Darkens the page behind the panel; clicking the darkened page closes the panel.
bootstrap5mix_Offcanvas.enableBodyScrolling.ui.tooltip=The page behind the panel can still be scrolled.
bootstrap5nt_buttonGroup.vertical.ui.tooltip=The buttons are placed one under the other instead of side by side.
bootstrap5nt_card.headerSize.ui.tooltip=Level of the title in the outline of the page (H2 under the page title, H3 under an H2\u2026). It does not change the size of the text. \u201CDefault\u201D is a plain paragraph, not a heading.
bootstrap5nt_card.footer.ui.tooltip=Short text shown at the bottom of the card. For richer content, tick \u201CRich footer\u201D in the advanced settings.
bootstrap5mix_colors_description=Colours of the card. Check that the text stays readable on the chosen background.
bootstrap5mix_cardAdvancedSettings.cssClass.ui.tooltip=For integrators: replaces the \u201Ccard\u201D class of the outer block. Keep \u201Ccard\u201D in it unless you restyle the card entirely.
bootstrap5mix_cardAdvancedSettings.cardHeaderCssClass.ui.tooltip=For integrators: replaces the \u201Ccard-header\u201D class of the header.
bootstrap5mix_cardAdvancedSettings.cardBodyCssClass.ui.tooltip=For integrators: replaces the \u201Ccard-body\u201D class of the body.
bootstrap5mix_cardAdvancedSettings.freeFooter.ui.tooltip=Replaces the footer text with an area where any content can be added from the page.
bootstrap5nt_carouselItem.image.ui.tooltip=Use images of the same proportions for all the slides, or the carousel changes height from one slide to the next.
bootstrap5nt_carouselItem.caption.ui.tooltip=Shown over the image, under the title.
bootstrap5mix_advancedCarouselItem.titleColor.ui.tooltip=Choose a colour that stays readable over the image.
bootstrap5mix_advancedCarouselItem.captionColor.ui.tooltip=Choose a colour that stays readable over the image.
bootstrap5mix_advancedCarouselItem.carouselItemClass.ui.tooltip=For integrators: CSS classes added to this slide.
bootstrap5mix_advancedCarouselItem.interval.ui.tooltip=Time this slide stays displayed, in milliseconds (5000 = 5 seconds). Empty: the delay of the carousel.
bootstrap5mix_carouselAdvancedSettings_description=Behaviour and controls of the carousel.
bootstrap5mix_carouselAdvancedSettings.useIndicators.ui.tooltip=Small bars at the bottom, one per slide, to jump to a slide.
bootstrap5mix_carouselAdvancedSettings.interval.ui.tooltip=In milliseconds: 5000 = 5 seconds, the default.
bootstrap5mix_carouselAdvancedSettings.keyboard.ui.tooltip=The left and right arrow keys change slide when the carousel has the focus.
bootstrap5mix_carouselAdvancedSettings.pause.ui.tooltip=The slides stop changing while the pointer is over the carousel.
bootstrap5mix_carouselAdvancedSettings.ride.ui.tooltip=The slides change by themselves. A pause button is added for keyboard and screen reader users. Unticked, visitors change slide themselves.
bootstrap5mix_carouselAdvancedSettings.wrap.ui.tooltip=After the last slide, the carousel starts again at the first one.
bootstrap5mix_carouselAdvancedSettings.fade.ui.tooltip=A slide fades into the next one instead of sliding sideways.
bootstrap5mix_carouselAdvancedSettings.carouselClass.ui.tooltip=For integrators: CSS classes added to the carousel.
bootstrap5mix_carouselAdvancedSettings.variant.ui.tooltip=Colour of the arrows, indicators and captions. Choose the one that contrasts with your images.
bootstrap5mix_figureAdvancedSettings.captionAlignment.ui.tooltip=Position of the caption under the image.
bootstrap5mix_createSection_description=Wraps this whole layout, with everything it contains, in one extra HTML element that says what this part of the page is.
bootstrap5mix_createSection.sectionElement.ui.tooltip=The HTML tag placed around this layout and its content. Choose it for its meaning: section for a thematic part, article for a self-contained piece, aside for side content, nav for navigation, header and footer for the top and bottom of a block, main for the main content of the page (only one per page). Use div when no meaning applies.
bootstrap5mix_createSection.sectionStyle.ui.tooltip=Optional. For integrators: CSS declarations applied to this element only, for example background-color: #f5f5f5; padding-top: 2rem.
bootstrap5mix_createSection.sectionRole.ui.tooltip=Optional, for accessibility specialists. The element type chosen above usually says enough; a role is only needed with a div.
bootstrap5mix_createSection.sectionAria.ui.tooltip=Optional. A short name read by screen readers to tell this part of the page from the others, for example \u201CLatest news\u201D. Not displayed.
bootstrap5mix_createContainer_description=Centres the content and limits its width. Without container, the content takes the whole width available.
bootstrap5mix_createContainer.containerType.ui.tooltip=\u201CFixed width\u201D centres the content and gives it a maximum width that grows by steps with the screen. \u201CFluid\u201D always takes the whole width. The other choices take the whole width on screens narrower than the size they name (a \u201Cbreakpoint\u201D), and a fixed width beyond it.
bootstrap5mix_createRow_description=Splits this layout into columns placed side by side. On small screens the columns go one under the other.
bootstrap5mix_createRow.typeOfGrid.ui.tooltip=Empty row: one single area. Predefined layout: choose among ready-made column widths. Custom layout: define each column yourself with Bootstrap classes.
bootstrap5mix_createRow.rowVerticalAlignment.ui.tooltip=How columns of different heights line up: \u201CTop\u201D, \u201CMiddle\u201D or \u201CBottom\u201D. \u201CDefault\u201D gives them all the height of the tallest one.
bootstrap5mix_createRow.rowHorizontalAlignment.ui.tooltip=Where the columns go when together they are narrower than the row. It has no visible effect when the columns fill the row, as the predefined layouts do.
bootstrap5mix_createRow.horizontalGutters.ui.tooltip=\u201CNone\u201D: the columns touch. From 1 to 5: wider and wider space. \u201CDefault\u201D is the standard space of Bootstrap (1.5rem, about 24 pixels).
bootstrap5mix_createRow.verticalGutters.ui.tooltip=Space between the columns when they go under one another, on small screens for example. \u201CNone\u201D: no space. From 1 to 5: wider and wider. \u201CDefault\u201D: no space.
bootstrap5mix_predefinedGrid.grid.ui.tooltip=Each number is the width of a column; a full row is 12. \u201C4 / 8\u201D is a narrow column followed by a column twice as wide; \u201C12\u201D is one single column.
bootstrap5mix_createAbsoluteAreas_description=The columns show content stored on a page higher in the site tree instead of content of their own: the same content appears on every page below that page.
bootstrap5mix_createAbsoluteAreas.level.ui.tooltip=\u201C0 \u2014 Home page\u201D is the home page, 1 the pages directly under it, and so on. The content is edited on that page only; on the pages below it is displayed and cannot be changed.
bootstrap5mix_listLimit_description=Limits the number of contents shown in each column.
bootstrap5mix_listLimit.listLimit.ui.tooltip=Contents beyond this number are not displayed, and editors cannot add more. \u201CNo limit\u201D shows everything.
bootstrap5nt_navbar.root.ui.tooltip=The page whose sub-pages make the menu. Home page: the whole site. Current page: the pages under the page displayed. Parent page: the pages at the same level as the page displayed. Custom page: a page you choose.
bootstrap5mix_navbarGlobalSettings_description=What the navigation bar contains.
bootstrap5mix_navbarGlobalSettings.addLoginButton.ui.tooltip=Adds a \u201CSign in\u201D button; once signed in, a menu with the user name and \u201CSign out\u201D.
bootstrap5mix_navbarGlobalSettings.addLanguageButton.ui.tooltip=Adds a menu to read the page in another language. Shown only when the site has at least two languages.
bootstrap5mix_navbarGlobalSettings.addColorModeButton.ui.tooltip=Adds a menu that lets visitors choose a light or dark display, or follow the setting of their device. Their choice is remembered.
bootstrap5mix_navbarGlobalSettings.maxlevel.ui.tooltip=1 shows the first level of pages only. 2 adds their sub-pages in drop-down menus, 3 and more add nested sub-menus.
bootstrap5mix_navbarGlobalSettings.addContainerWithinTheNavbar.ui.tooltip=Lines the content of the bar up with the content of the page. Untick for a bar whose content spans the whole width.
bootstrap5mix_customizeNavbar_description=For integrators: the CSS classes of each part of the navigation bar. Empty fields use the Bootstrap defaults.
bootstrap5mix_customizeNavbar.navClass.ui.tooltip=Sets the colours and the screen size from which the menu is displayed in full: navbar-expand-lg unfolds it on large screens. For a bar that follows the dark mode, use bg-body-tertiary.
bootstrap5mix_brand_description=Name and logo shown at the start of this navigation bar. Ignored when a brand is set on the site.
bootstrap5mix_brand.brandText.ui.tooltip=Shown next to the logo. With a logo and no text, the name of the site describes the logo for people who cannot see it.
bootstrap5mix_brand.brandImageMobile.ui.tooltip=Optional. Shown instead of the desktop logo while the menu is folded.
bootstrap5mix_siteBrand_description=Name and logo shown at the start of every navigation bar of the site. Replaces the brand set on each navigation bar.
bootstrap5mix_siteBrand.brandText.ui.tooltip=Shown next to the logo. With a logo and no text, the name of the site describes the logo for people who cannot see it.
bootstrap5mix_siteBrand.brandImageMobile.ui.tooltip=Optional. Shown instead of the desktop logo while the menu is folded.
bootstrap5mix_siteColorMode_description=Light or dark display of the whole site.
bootstrap5mix_siteColorMode.colorMode.ui.tooltip=The mode visitors get when they have not chosen one with the switcher of the navigation bar.
bootstrap5mix_customRootPage.customRootPage.ui.tooltip=The menu lists the sub-pages of this page.
bootstrap5nt_pagination.displayPager.ui.tooltip=Unticked, the list is still cut into pages but visitors get no links to the other pages.
bootstrap5mix_advancedPagination.nbOfPages.ui.tooltip=Beyond this number, the bar only shows the pages around the current one.
bootstrap5mix_advancedPagination.nbOfPagesInEdit.ui.tooltip=While editing, the list shows this many items so that you can reach them all without changing page.
bootstrap5nt_progress.max.ui.tooltip=The bar is filled in proportion: a value of 30 with a maximum of 120 fills a quarter of the bar.
bootstrap5nt_progress.striped.ui.tooltip=Adds diagonal stripes to the filled part.
bootstrap5nt_tabs.type.ui.tooltip=Appearance of the tab bar. Each tab is a content list added to this component; its title is the text of the tab.
bootstrap5nt_tabs.align.ui.tooltip=Position of the tabs in the bar. \u201CFill\u201D and \u201CJustified\u201D spread them over the whole width: in proportion to their text, or all at the same width.
bootstrap5nt_tabs.useListNameAsAnchor.ui.tooltip=The address of the page can open a given tab (\u2026#name-of-the-list). Unticked, a technical identifier is used instead of the name.
bootstrap5mix_Offcanvas.placement.ui.tooltip=Edge of the screen the panel comes from. \u201CStart\u201D is the left and \u201CEnd\u201D the right in languages read from left to right (LTR); they swap otherwise.
bootstrap5mix_colors.textColor.ui.tooltip=\u201CBody\u201D is the normal text colour of the site; \u201CMuted\u201D a lighter grey for secondary text. Check that the text stays readable on the chosen background.
bootstrap5mix_colors.backgroundColor.ui.tooltip=\u201CDefault\u201D keeps the standard background of a card.
bootstrap5mix_modal.modalSize.ui.tooltip=Width of the window on large screens. On a phone it always takes the width of the screen.
bootstrap5mix_advancedPagination.align.ui.tooltip=Position of the pagination bar in the width of its container.
bootstrap5nt_card.textAlign.ui.tooltip=Alignment of the text of the whole card. \u201CStart\u201D is the left in languages read from left to right.
