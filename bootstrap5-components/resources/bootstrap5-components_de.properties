bootstrap5nt_card.jcr_title=Kartentitel
bootstrap5nt_carouselItem.jcr_title.ui.tooltip=Wird \u00FCber dem Bild angezeigt und Personen vorgelesen, die es nicht sehen k\u00F6nnen.
bootstrap5nt_accordion.jcr_title.ui.tooltip=Die anklickbare \u00DCberschrift, die das Panel \u00F6ffnet und schlie\u00DFt.
bootstrap5nt_button.jcr_title.ui.tooltip=Der Text auf der Schaltfl\u00E4che. Bleibt das Feld leer, zeigt ein interner Link den Titel seiner Zielseite, die anderen Schaltfl\u00E4chen zeigen \u201EMehr lesen\u201C.
bootstrap5nt_card.jcr_title.ui.tooltip=Wird im Header der Karte angezeigt. Lassen Sie das Feld leer, wenn die Karte keinen Header haben soll.
bootstrap5nt_figure.jcr_title.ui.tooltip=Kurzer Text, der unter dem Bild angezeigt wird.
bootstrap5nt_buttonGroup.jcr_title.ui.tooltip=Wird nicht angezeigt. Teilt Screenreader-Nutzern mit, was die Schaltfl\u00E4chen gemeinsam haben, zum Beispiel \u201ETeilen\u201C.
bootstrap5mix_padding_description=Abstand innerhalb der Komponente, zwischen ihrem Rand und ihrem Inhalt.
bootstrap5mix_padding.paddingWhere.ui.tooltip=Legt fest, auf welchen Seiten der Abstand hinzugef\u00FCgt wird. Bei Leserichtung von links nach rechts liegt \u201EStart\u201C links und \u201EEnde\u201C rechts. Bei umgekehrter Leserichtung ist es umgekehrt.
bootstrap5mix_padding.paddingSize.ui.tooltip=Von 0 (kein Abstand) bis 5 (am gr\u00F6\u00DFten). Ein rem entspricht der Gr\u00F6\u00DFe des Grundtexts, meist 16 Pixel: \u201E3 \u2014 1rem\u201C ist so hoch wie eine Textzeile.
bootstrap5mix_margin_description=Abstand au\u00DFerhalb der Komponente, zwischen ihr und ihren Nachbarn.
bootstrap5mix_margin.marginWhere.ui.tooltip=Legt fest, auf welchen Seiten der Abstand hinzugef\u00FCgt wird. Bei Leserichtung von links nach rechts liegt \u201EStart\u201C links und \u201EEnde\u201C rechts. Bei umgekehrter Leserichtung ist es umgekehrt.
bootstrap5mix_margin.marginSize.ui.tooltip=Von 0 (kein Abstand) bis 5 (am gr\u00F6\u00DFten). Ein rem entspricht der Gr\u00F6\u00DFe des Grundtexts, meist 16 Pixel: \u201E3 \u2014 1rem\u201C ist so hoch wie eine Textzeile.
bootstrap5mix_imageAdvancedSettings_description=Optionale Einstellungen f\u00FCr die Darstellung des Bildes.
bootstrap5mix_imageAdvancedSettings.imageClass.ui.tooltip=F\u00FCr Integratoren: CSS-Klassen, die dem Bild hinzugef\u00FCgt werden, durch Leerzeichen getrennt.
bootstrap5mix_imageAdvancedSettings.imageStyle.ui.tooltip=F\u00FCr Integratoren: CSS-Deklarationen, die nur f\u00FCr dieses Bild gelten, zum Beispiel max-width: 300px.
bootstrap5mix_imageAdvancedSettings.imageID.ui.tooltip=F\u00FCr Integratoren: ID, \u00FCber die ein Link, ein Skript oder ein Stylesheet dieses Bild anspricht. Muss auf der Seite eindeutig sein.
bootstrap5mix_imageAdvancedSettings.responsive.ui.tooltip=Das Bild verkleinert sich mit seinem Container und ragt nie \u00FCber ihn hinaus. Deaktivieren Sie die Option nur f\u00FCr Bilder, die ihre exakte Gr\u00F6\u00DFe behalten m\u00FCssen.
bootstrap5mix_imageAdvancedSettings.thumbnails.ui.tooltip=F\u00FCgt einen d\u00FCnnen Rahmen und einen kleinen Abstand um das Bild hinzu.
bootstrap5mix_imageAdvancedSettings.align.ui.tooltip=Bei \u201EStart\u201C und \u201EEnde\u201C steht das Bild seitlich und der Text flie\u00DFt darum herum. Bei Leserichtung von links nach rechts (LTR) liegt \u201EStart\u201C links und \u201EEnde\u201C rechts. Bei umgekehrter Leserichtung sind die Seiten vertauscht. Bei \u201EMitte\u201C steht das Bild allein in einer Zeile.
bootstrap5mix_imageAdvancedSettings.alt.ui.tooltip=Beschreibt das Bild f\u00FCr Personen, die es nicht sehen k\u00F6nnen. Bleibt das Feld leer, wird der Titel der Bilddatei verwendet.
bootstrap5mix_imageAdvancedSettings.borderRadius.ui.tooltip=Welche Ecken abgerundet werden. \u201EKreis\u201C und \u201EKapselform\u201C ignorieren die Gr\u00F6\u00DFe darunter. \u201EKein Radius\u201C l\u00E4sst die Ecken eckig.
bootstrap5mix_imageAdvancedSettings.borderRadiusSize.ui.tooltip=Wie stark die gew\u00E4hlten Ecken abgerundet werden. \u201EStandard\u201C ist die \u00FCbliche Abrundung von Bootstrap.
bootstrap5nt_accordion.show.ui.tooltip=Das Panel ist beim Laden der Seite ge\u00F6ffnet. Sobald sich ein anderes Panel \u00F6ffnet, schlie\u00DFt sich das zuvor ge\u00F6ffnete Panel.
bootstrap5nt_accordions.flush.ui.tooltip=F\u00FCr ein Akkordeon, das bis an die R\u00E4nder seines Containers reicht, zum Beispiel in einer Karte oder einer Seitenleiste.
bootstrap5mix_alert_description=Zeigt diesen Inhalt in einer farbigen Box an, die Aufmerksamkeit auf sich zieht.
bootstrap5mix_alert.backgroundColor.ui.tooltip=Die Farbe tr\u00E4gt eine Bedeutung: \u201ESuccess\u201C ist gr\u00FCn, \u201EWarning\u201C gelb, \u201EDanger\u201C rot, \u201EInfo\u201C hellblau. Sagen Sie es auch im Text, Farbe allein nimmt nicht jeder wahr. \u201ELink\u201C und \u201EBenutzerdefiniert\u201C wirken nur, wenn das Stylesheet Ihrer Website sie definiert.
bootstrap5mix_alert.addDismissButton.ui.tooltip=Besucher k\u00F6nnen die Box schlie\u00DFen. Beim erneuten Laden der Seite erscheint sie wieder.
bootstrap5mix_advancedBreadcrumb.cssClass.ui.tooltip=F\u00FCr Integratoren: CSS-Klassen, die der Liste des Navigationspfads hinzugef\u00FCgt werden, durch Leerzeichen getrennt.
bootstrap5nt_button.buttonType.ui.tooltip=Was beim Klick auf die Schaltfl\u00E4che geschieht. Die Einstellungen der gew\u00E4hlten Aktion erscheinen darunter.
bootstrap5mix_buttonAdvancedSettings_description=Aussehen der Schaltfl\u00E4che.
bootstrap5mix_buttonAdvancedSettings.style.ui.tooltip=Farbe der Schaltfl\u00E4che. Verwenden Sie \u201EPrimary\u201C nur einmal, f\u00FCr die Hauptaktion der Seite. \u201EKein Hintergrund\u201C sieht aus wie ein einfacher Link. \u201EBenutzerdefiniert\u201C entfernt die Bootstrap-Klassen und verwendet nur das Feld f\u00FCr die CSS-Klasse.
bootstrap5mix_buttonAdvancedSettings.outline.ui.tooltip=Farbiger Rahmen und Text auf transparentem Hintergrund, f\u00FCr eine weniger auff\u00E4llige Schaltfl\u00E4che.
bootstrap5mix_buttonAdvancedSettings.block.ui.tooltip=Die Schaltfl\u00E4che nimmt die gesamte Breite ihres Containers ein.
bootstrap5mix_buttonAdvancedSettings.state.ui.tooltip=\u201EAktiv\u201C zeigt die Schaltfl\u00E4che als gedr\u00FCckt. \u201EDeaktiviert\u201C graut sie aus, sie kann nicht mehr angeklickt werden.
bootstrap5mix_buttonAdvancedSettings.cssClass.ui.tooltip=F\u00FCr Integratoren: CSS-Klassen, die der Schaltfl\u00E4che hinzugef\u00FCgt werden. Beim Stil \u201EBenutzerdefiniert\u201C sind sie die einzigen Klassen der Schaltfl\u00E4che.
bootstrap5mix_buttonAdvancedSettings.disableTextWrapping.ui.tooltip=Der Text bleibt in einer Zeile, auch in einem schmalen Container.
bootstrap5mix_buttonAdvancedSettings.stretchedLink.ui.tooltip=Ein Klick an beliebiger Stelle im Block, der die Schaltfl\u00E4che enth\u00E4lt, \u00F6ffnet den Link. Das gilt zum Beispiel f\u00FCr eine Karte.
bootstrap5mix_buttonAdvancedSettings.tooltip.ui.tooltip=Kurzer Text, der erscheint, wenn der Mauszeiger auf der Schaltfl\u00E4che steht oder wenn die Schaltfl\u00E4che mit der Tastatur ausgew\u00E4hlt wird. Nutzer von Touchscreens sehen ihn m\u00F6glicherweise nie: Hinterlegen Sie darin keine wesentlichen Informationen.
bootstrap5mix_collapse_description=Die Schaltfl\u00E4che blendet den Inhalt ein und aus, den Sie auf der Seite unter ihr hinzuf\u00FCgen.
bootstrap5mix_collapse.show.ui.tooltip=Der Inhalt ist beim Laden der Seite sichtbar.
bootstrap5mix_internalLink_description=Die Schaltfl\u00E4che \u00F6ffnet eine Seite oder eine Datei dieser Website.
bootstrap5mix_externalLink_description=Die Schaltfl\u00E4che \u00F6ffnet eine Adresse au\u00DFerhalb dieser Website.
bootstrap5mix_externalLink.externalLink.ui.tooltip=Vollst\u00E4ndige Adresse, die mit https:// beginnt. Eine E-Mail-Adresse (mailto:) oder eine Telefonnummer (tel:) funktionieren ebenfalls.
bootstrap5mix_modal_description=Die Schaltfl\u00E4che \u00F6ffnet ein Fenster \u00FCber der Seite. F\u00FCgen Sie den Inhalt des Fensters von der Seite aus hinzu, innerhalb der Schaltfl\u00E4che.
bootstrap5mix_modal.modalTitle.ui.tooltip=Wird oben im Fenster angezeigt. Ohne Titel fehlen die Kopfzeile und das Kreuz zum Schlie\u00DFen.
bootstrap5mix_modal.closeText.ui.tooltip=Text der Schaltfl\u00E4che unten im Fenster. \u201ESchlie\u00DFen\u201C, wenn das Feld leer bleibt.
bootstrap5mix_modal.staticBackdrop.ui.tooltip=Das Fenster l\u00E4sst sich nur \u00FCber seine eigenen Schaltfl\u00E4chen schlie\u00DFen, f\u00FCr Inhalte, die gelesen werden m\u00FCssen.
bootstrap5mix_modal.verticallyCentered.ui.tooltip=Zentriert das Fenster in der Bildschirmh\u00F6he, statt es oben zu platzieren.
bootstrap5mix_popover_description=Die Schaltfl\u00E4che zeigt neben sich eine kleine Sprechblase an. Ein Klick an anderer Stelle schlie\u00DFt sie.
bootstrap5mix_popover.direction.ui.tooltip=Seite der Schaltfl\u00E4che, auf der die Sprechblase erscheint. Reicht der Platz nicht, wechselt sie auf eine andere Seite.
bootstrap5mix_popover.html.ui.tooltip=Der Inhalt wird als HTML statt als reiner Text interpretiert. Aktivieren Sie die Option nur f\u00FCr Inhalte, die Sie selbst verfasst haben.
bootstrap5mix_Offcanvas_description=Die Schaltfl\u00E4che \u00F6ffnet ein Panel, das von einem Bildschirmrand hereingleitet. F\u00FCgen Sie den Inhalt des Panels von der Seite aus hinzu, innerhalb der Schaltfl\u00E4che.
bootstrap5mix_Offcanvas.OffcanvasTitle.ui.tooltip=Wird oben im Panel neben dem Kreuz zum Schlie\u00DFen angezeigt.
bootstrap5mix_Offcanvas.enableBackdrop.ui.tooltip=Dunkelt die Seite hinter dem Panel ab; ein Klick auf die abgedunkelte Seite schlie\u00DFt das Panel.
bootstrap5mix_Offcanvas.enableBodyScrolling.ui.tooltip=Die Seite hinter dem Panel l\u00E4sst sich weiterhin scrollen.
bootstrap5nt_buttonGroup.vertical.ui.tooltip=Die Schaltfl\u00E4chen stehen untereinander statt nebeneinander.
bootstrap5nt_card.headerSize.ui.tooltip=Ebene der \u00DCberschrift in der Gliederung der Seite (H2 unter dem Seitentitel, H3 unter einer H2\u2026). \u00C4ndert die Textgr\u00F6\u00DFe nicht. \u201EStandard\u201C ist ein einfacher Absatz, keine \u00DCberschrift.
bootstrap5nt_card.footer.ui.tooltip=Kurzer Text, der unten in der Karte angezeigt wird. F\u00FCr umfangreichere Inhalte aktivieren Sie \u201EFreie Fu\u00DFzeile\u201C in den erweiterten Einstellungen.
bootstrap5mix_colors_description=Farben der Karte. Pr\u00FCfen Sie, ob der Text auf dem gew\u00E4hlten Hintergrund lesbar bleibt.
bootstrap5mix_cardAdvancedSettings.cssClass.ui.tooltip=F\u00FCr Integratoren: ersetzt die Klasse \u201Ecard\u201C des \u00E4u\u00DFeren Blocks. Behalten Sie \u201Ecard\u201C bei, sofern Sie die Karte nicht vollst\u00E4ndig neu gestalten.
bootstrap5mix_cardAdvancedSettings.cardHeaderCssClass.ui.tooltip=F\u00FCr Integratoren: ersetzt die Klasse \u201Ecard-header\u201C des Headers.
bootstrap5mix_cardAdvancedSettings.cardBodyCssClass.ui.tooltip=F\u00FCr Integratoren: ersetzt die Klasse \u201Ecard-body\u201C im Inhaltsbereich der Karte.
bootstrap5mix_cardAdvancedSettings.freeFooter.ui.tooltip=Ersetzt den Fu\u00DFzeilentext durch einen Bereich, in den sich von der Seite aus beliebige Inhalte einf\u00FCgen lassen.
bootstrap5nt_carouselItem.image.ui.tooltip=Verwenden Sie f\u00FCr alle Folien Bilder mit demselben Seitenverh\u00E4ltnis, sonst \u00E4ndert das Karussell von Folie zu Folie seine H\u00F6he.
bootstrap5nt_carouselItem.caption.ui.tooltip=Wird \u00FCber dem Bild angezeigt, unter dem Titel.
bootstrap5mix_advancedCarouselItem.titleColor.ui.tooltip=W\u00E4hlen Sie eine Farbe, mit der der Text auf dem Bild gut lesbar bleibt.
bootstrap5mix_advancedCarouselItem.captionColor.ui.tooltip=W\u00E4hlen Sie eine Farbe, mit der der Text auf dem Bild gut lesbar bleibt.
bootstrap5mix_advancedCarouselItem.carouselItemClass.ui.tooltip=F\u00FCr Integratoren: CSS-Klassen, die dieser Folie hinzugef\u00FCgt werden.
bootstrap5mix_advancedCarouselItem.interval.ui.tooltip=Anzeigedauer dieser Folie in Millisekunden (5000 = 5 Sekunden). Bleibt das Feld leer, gilt die Anzeigedauer des Karussells.
bootstrap5mix_carouselAdvancedSettings_description=Verhalten und Steuerelemente des Karussells.
bootstrap5mix_carouselAdvancedSettings.useIndicators.ui.tooltip=Kleine Balken am unteren Rand, einer pro Folie, um direkt zu einer Folie zu springen.
bootstrap5mix_carouselAdvancedSettings.interval.ui.tooltip=In Millisekunden: 5000 = 5 Sekunden, der Standardwert.
bootstrap5mix_carouselAdvancedSettings.keyboard.ui.tooltip=Die Pfeiltasten links und rechts wechseln die Folie, wenn das Karussell mit der Tastatur ausgew\u00E4hlt ist.
bootstrap5mix_carouselAdvancedSettings.pause.ui.tooltip=Die Folien wechseln nicht, solange der Mauszeiger \u00FCber dem Karussell steht.
bootstrap5mix_carouselAdvancedSettings.ride.ui.tooltip=Die Folien wechseln automatisch. F\u00FCr Tastatur- und Screenreader-Nutzer wird eine Pause-Schaltfl\u00E4che hinzugef\u00FCgt. Ist die Option deaktiviert, wechseln die Besucher die Folien selbst.
bootstrap5mix_carouselAdvancedSettings.wrap.ui.tooltip=Nach der letzten Folie beginnt das Karussell wieder bei der ersten.
bootstrap5mix_carouselAdvancedSettings.fade.ui.tooltip=Eine Folie wird in die n\u00E4chste \u00FCberblendet, statt seitlich zu gleiten.
bootstrap5mix_carouselAdvancedSettings.carouselClass.ui.tooltip=F\u00FCr Integratoren: CSS-Klassen, die dem Karussell hinzugef\u00FCgt werden.
bootstrap5mix_carouselAdvancedSettings.variant.ui.tooltip=Farbe der Pfeile, Folienanzeiger und Bildunterschriften. W\u00E4hlen Sie die Farbe, die sich von Ihren Bildern abhebt.
bootstrap5mix_figureAdvancedSettings.captionAlignment.ui.tooltip=Position der Bildunterschrift unter dem Bild.
bootstrap5mix_createSection_description=Umschlie\u00DFt dieses gesamte Layout samt Inhalt mit einem zus\u00E4tzlichen HTML-Element, das angibt, was dieser Teil der Seite ist.
bootstrap5mix_createSection.sectionElement.ui.tooltip=Das HTML-Tag, das dieses Layout und seinen Inhalt umschlie\u00DFt. W\u00E4hlen Sie es nach seiner Bedeutung: section f\u00FCr einen thematischen Abschnitt, article f\u00FCr einen eigenst\u00E4ndigen Inhalt, aside f\u00FCr erg\u00E4nzende Inhalte, nav f\u00FCr eine Navigation, header und footer f\u00FCr den oberen und unteren Teil eines Blocks, main f\u00FCr den Hauptinhalt der Seite (nur einmal pro Seite). Verwenden Sie div, wenn keine Bedeutung zutrifft.
bootstrap5mix_createSection.sectionStyle.ui.tooltip=Optional. F\u00FCr Integratoren: CSS-Deklarationen, die nur f\u00FCr dieses Element gelten, zum Beispiel background-color: #f5f5f5; padding-top: 2rem.
bootstrap5mix_createSection.sectionRole.ui.tooltip=Optional, f\u00FCr Fachleute f\u00FCr Barrierefreiheit. Der oben gew\u00E4hlte Elementtyp sagt in der Regel genug aus; eine Rolle ist nur bei einem div sinnvoll.
bootstrap5mix_createSection.sectionAria.ui.tooltip=Optional. Ein kurzer Name, den Screenreader vorlesen, um diesen Teil der Seite von den anderen zu unterscheiden, zum Beispiel \u201EAktuelle Nachrichten\u201C. Wird nicht angezeigt.
bootstrap5mix_createContainer_description=Zentriert den Inhalt und begrenzt seine Breite. Ohne Container nimmt der Inhalt die gesamte verf\u00FCgbare Breite ein.
bootstrap5mix_createContainer.containerType.ui.tooltip=\u201EFeste Breite\u201C zentriert den Inhalt und gibt ihm eine maximale Breite, die stufenweise mit dem Bildschirm w\u00E4chst. \u201EFluid\u201C nimmt immer die ganze Breite ein. Bei den anderen Optionen nimmt der Inhalt bis zur angegebenen Bildschirmbreite den ganzen Platz ein. Ab dieser Breite, dem Breakpoint, ist die Breite des Inhalts fest.
bootstrap5mix_createRow_description=Teilt dieses Layout in nebeneinanderliegende Spalten auf. Auf kleinen Bildschirmen stehen die Spalten untereinander.
bootstrap5mix_createRow.typeOfGrid.ui.tooltip=\u201ELeere Zeile\u201C: ein einziger Bereich. \u201EVordefiniertes Layout\u201C: W\u00E4hlen Sie aus fertigen Spaltenbreiten. \u201EBenutzerdefiniertes Layout\u201C: Definieren Sie jede Spalte selbst mit Bootstrap-Klassen.
bootstrap5mix_createRow.rowVerticalAlignment.ui.tooltip=Ausrichtung von Spalten unterschiedlicher H\u00F6he: \u201EOben\u201C, \u201EMitte\u201C oder \u201EUnten\u201C. \u201EStandard\u201C gibt allen die H\u00F6he der h\u00F6chsten Spalte.
bootstrap5mix_createRow.rowHorizontalAlignment.ui.tooltip=Position der Spalten, wenn sie zusammen schmaler sind als die Zeile. Ohne sichtbare Wirkung, wenn die Spalten die Zeile f\u00FCllen, wie bei den vordefinierten Layouts.
bootstrap5mix_createRow.horizontalGutters.ui.tooltip=\u201EKein Abstand\u201C: Die Spalten ber\u00FChren sich. Von 1 bis 5: immer gr\u00F6\u00DFerer Abstand. \u201EStandard\u201C ist der \u00FCbliche Abstand von Bootstrap (1,5rem, etwa 24 Pixel).
bootstrap5mix_createRow.verticalGutters.ui.tooltip=Abstand zwischen den Spalten, wenn sie untereinander rutschen, zum Beispiel auf kleinen Bildschirmen. \u201EKein Abstand\u201C: kein Abstand. Von 1 bis 5: immer gr\u00F6\u00DFer. \u201EStandard\u201C: kein Abstand.
bootstrap5mix_predefinedGrid.grid.ui.tooltip=Jede Zahl ist die Breite einer Spalte; eine volle Zeile ergibt 12. \u201E4 / 8\u201C ist eine schmale Spalte, gefolgt von einer doppelt so breiten; \u201E12\u201C ist eine einzige Spalte.
bootstrap5mix_createAbsoluteAreas_description=Die Spalten zeigen statt eigener Inhalte einen Inhalt an, der auf einer Seite weiter oben im Seitenbaum gespeichert ist: Derselbe Inhalt erscheint auf allen Seiten unterhalb dieser Seite.
bootstrap5mix_createAbsoluteAreas.level.ui.tooltip=\u201E0 \u2014 Startseite\u201C ist die Startseite, 1 sind die Seiten direkt darunter, und so weiter. Der Inhalt wird nur auf dieser Seite bearbeitet; auf den Seiten darunter wird er angezeigt und kann nicht ge\u00E4ndert werden.
bootstrap5mix_listLimit_description=Begrenzt die Anzahl der Inhalte, die in jeder Spalte angezeigt werden.
bootstrap5mix_listLimit.listLimit.ui.tooltip=Inhalte \u00FCber diese Anzahl hinaus werden nicht angezeigt, und Redakteure k\u00F6nnen keine weiteren hinzuf\u00FCgen. \u201EKein Limit\u201C zeigt alles an.
bootstrap5nt_navbar.root.ui.tooltip=Die Seite, deren Unterseiten das Men\u00FC bilden. \u201EStartseite\u201C: die ganze Website. \u201EAktuelle Seite\u201C: die Seiten unter der angezeigten Seite. \u201E\u00DCbergeordnete Seite\u201C: die Seiten auf derselben Ebene wie die angezeigte Seite. \u201EBenutzerdefinierte Seite\u201C: eine Seite Ihrer Wahl.
bootstrap5mix_navbarGlobalSettings_description=Was die Navigationsleiste enth\u00E4lt.
bootstrap5mix_navbarGlobalSettings.addLoginButton.ui.tooltip=F\u00FCgt eine Schaltfl\u00E4che \u201EAnmelden\u201C hinzu; nach der Anmeldung ein Men\u00FC mit dem Benutzernamen und \u201EAbmelden\u201C.
bootstrap5mix_navbarGlobalSettings.addLanguageButton.ui.tooltip=F\u00FCgt ein Men\u00FC hinzu, um die Seite in einer anderen Sprache zu lesen. Wird nur angezeigt, wenn die Website mindestens zwei Sprachen hat.
bootstrap5mix_navbarGlobalSettings.addColorModeButton.ui.tooltip=F\u00FCgt ein Men\u00FC hinzu, mit dem Besucher eine helle oder dunkle Darstellung w\u00E4hlen oder der Einstellung ihres Ger\u00E4ts folgen k\u00F6nnen. Ihre Auswahl wird gespeichert.
bootstrap5mix_navbarGlobalSettings.maxlevel.ui.tooltip=1 zeigt nur die erste Seitenebene. 2 erg\u00E4nzt deren Unterseiten in Dropdown-Men\u00FCs, 3 und mehr erg\u00E4nzen verschachtelte Untermen\u00FCs.
bootstrap5mix_navbarGlobalSettings.addContainerWithinTheNavbar.ui.tooltip=Richtet den Inhalt der Leiste am Inhalt der Seite aus. Deaktivieren Sie die Option f\u00FCr eine Leiste, deren Inhalt die gesamte Breite einnimmt.
bootstrap5mix_customizeNavbar_description=F\u00FCr Integratoren: die CSS-Klassen der einzelnen Teile der Navigationsleiste. Leere Felder verwenden die Standardwerte von Bootstrap.
bootstrap5mix_customizeNavbar.navClass.ui.tooltip=Legt die Farben fest und die Bildschirmgr\u00F6\u00DFe, ab der das Men\u00FC vollst\u00E4ndig angezeigt wird: navbar-expand-lg klappt es auf gro\u00DFen Bildschirmen aus. F\u00FCr eine Leiste, die dem dunklen Modus folgt, verwenden Sie bg-body-tertiary.
bootstrap5mix_brand_description=Name und Logo am Anfang dieser Navigationsleiste. Wird ignoriert, wenn f\u00FCr die Website eine Marke festgelegt ist.
bootstrap5mix_brand.brandText.ui.tooltip=Wird neben dem Logo angezeigt. Bei einem Logo ohne Text beschreibt der Name der Website das Logo f\u00FCr Personen, die es nicht sehen k\u00F6nnen.
bootstrap5mix_brand.brandImageMobile.ui.tooltip=Optional. Wird anstelle des Desktop-Logos angezeigt, solange das Men\u00FC eingeklappt ist.
bootstrap5mix_siteBrand_description=Name und Logo am Anfang jeder Navigationsleiste der Website. Ersetzt die Marke, die an den einzelnen Navigationsleisten festgelegt ist.
bootstrap5mix_siteBrand.brandText.ui.tooltip=Wird neben dem Logo angezeigt. Bei einem Logo ohne Text beschreibt der Name der Website das Logo f\u00FCr Personen, die es nicht sehen k\u00F6nnen.
bootstrap5mix_siteBrand.brandImageMobile.ui.tooltip=Optional. Wird anstelle des Desktop-Logos angezeigt, solange das Men\u00FC eingeklappt ist.
bootstrap5mix_siteColorMode_description=Helle oder dunkle Darstellung der gesamten Website.
bootstrap5mix_siteColorMode.colorMode.ui.tooltip=Der Modus f\u00FCr Besucher, die mit dem Umschalter der Navigationsleiste keinen gew\u00E4hlt haben.
bootstrap5mix_customRootPage.customRootPage.ui.tooltip=Das Men\u00FC listet die Unterseiten dieser Seite auf.
bootstrap5nt_pagination.displayPager.ui.tooltip=Ist die Option deaktiviert, wird die Liste weiterhin in Seiten aufgeteilt, die Besucher erhalten aber keine Links zu den anderen Seiten.
bootstrap5mix_advancedPagination.nbOfPages.ui.tooltip=\u00DCber dieser Anzahl zeigt die Leiste nur die Seiten rund um die aktuelle Seite.
bootstrap5mix_advancedPagination.nbOfPagesInEdit.ui.tooltip=Im Bearbeitungsmodus zeigt die Liste diese Anzahl von Eintr\u00E4gen, damit Sie alle erreichen, ohne die Seite zu wechseln.
bootstrap5nt_progress.max.ui.tooltip=Der Balken wird anteilig gef\u00FCllt: Ein Wert von 30 bei einem Maximum von 120 f\u00FCllt ein Viertel des Balkens.
bootstrap5nt_progress.striped.ui.tooltip=F\u00FCgt dem gef\u00FCllten Teil diagonale Streifen hinzu.
bootstrap5nt_tabs.type.ui.tooltip=Aussehen der Tab-Leiste. Jeder Tab ist eine Inhaltsliste, die dieser Komponente hinzugef\u00FCgt wird; ihr Titel ist der Text des Tabs.
bootstrap5nt_tabs.align.ui.tooltip=Position der Tabs in der Leiste. Beide Optionen nutzen die gesamte Breite der Leiste. Bei \u201EF\u00FCllen\u201C richtet sich die Breite jedes Tabs nach der L\u00E4nge seiner Beschriftung. Bei \u201EGleich breit\u201C haben alle Tabs dieselbe Breite.
bootstrap5nt_tabs.useListNameAsAnchor.ui.tooltip=Die Adresse der Seite kann einen bestimmten Tab \u00F6ffnen (\u2026#name-der-liste). Ist die Option deaktiviert, wird statt des Namens eine technische ID verwendet.
bootstrap5mix_Offcanvas.placement.ui.tooltip=Bildschirmrand, von dem aus das Panel eingeblendet wird. Bei Leserichtung von links nach rechts (LTR) liegt \u201EStart\u201C links und \u201EEnde\u201C rechts. Bei umgekehrter Leserichtung sind die Seiten vertauscht.
bootstrap5mix_colors.textColor.ui.tooltip=\u201EBody\u201C ist die normale Textfarbe der Website; \u201EAbgeschw\u00E4cht\u201C ein helleres Grau f\u00FCr Nebentext. Pr\u00FCfen Sie, ob der Text auf dem gew\u00E4hlten Hintergrund lesbar bleibt.
bootstrap5mix_colors.backgroundColor.ui.tooltip=\u201EStandard\u201C beh\u00E4lt den \u00FCblichen Hintergrund einer Karte.
bootstrap5mix_modal.modalSize.ui.tooltip=Breite des Fensters auf gro\u00DFen Bildschirmen. Auf einem Smartphone nimmt das Fenster immer die gesamte Bildschirmbreite ein.
bootstrap5mix_advancedPagination.align.ui.tooltip=Horizontale Position der Seitennavigation innerhalb ihres Containers.
bootstrap5nt_card.textAlign.ui.tooltip=Ausrichtung des Texts der ganzen Karte. \u201EStart\u201C ist links in Sprachen, die von links nach rechts gelesen werden.
