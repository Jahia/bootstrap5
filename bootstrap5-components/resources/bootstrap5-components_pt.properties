bootstrap5nt_carouselItem.jcr_title.ui.tooltip=Mostrado sobre a imagem e lido \u00E0s pessoas que n\u00E3o a conseguem ver.
bootstrap5nt_accordion.jcr_title.ui.tooltip=O cabe\u00E7alho clic\u00E1vel que abre e fecha o painel.
bootstrap5nt_button.jcr_title.ui.tooltip=O texto do bot\u00E3o. Se estiver vazio, uma liga\u00E7\u00E3o interna mostra o t\u00EDtulo da p\u00E1gina de destino e os outros bot\u00F5es mostram \u00ABLer mais\u00BB.
bootstrap5nt_card.jcr_title.ui.tooltip=Mostrado no cabe\u00E7alho do cart\u00E3o. Deixar vazio para um cart\u00E3o sem cabe\u00E7alho.
bootstrap5nt_figure.jcr_title.ui.tooltip=Texto curto mostrado por baixo da imagem.
bootstrap5nt_buttonGroup.jcr_title.ui.tooltip=N\u00E3o \u00E9 mostrado. Indica aos utilizadores de leitores de ecr\u00E3 o que os bot\u00F5es t\u00EAm em comum, por exemplo \u00ABPartilhar\u00BB.
bootstrap5mix_padding_description=Espa\u00E7o no interior do componente, entre o seu limite e o seu conte\u00FAdo.
bootstrap5mix_padding.paddingWhere.ui.tooltip=Lados que recebem o espa\u00E7o. \u00ABIn\u00EDcio\u00BB e \u00ABFim\u00BB s\u00E3o a esquerda e a direita nas l\u00EDnguas lidas da esquerda para a direita, e invertem-se nas l\u00EDnguas lidas da direita para a esquerda.
bootstrap5mix_padding.paddingSize.ui.tooltip=De 0 (nenhum) a 5 (o maior). Um rem \u00E9 o tamanho do texto de base, normalmente 16 p\u00EDxeis: \u00AB3 \u2014 1rem\u00BB corresponde \u00E0 altura de uma linha de texto.
bootstrap5mix_margin_description=Espa\u00E7o no exterior do componente, entre este e os elementos vizinhos.
bootstrap5mix_margin.marginWhere.ui.tooltip=Lados que recebem o espa\u00E7o. \u00ABIn\u00EDcio\u00BB e \u00ABFim\u00BB s\u00E3o a esquerda e a direita nas l\u00EDnguas lidas da esquerda para a direita, e invertem-se nas l\u00EDnguas lidas da direita para a esquerda.
bootstrap5mix_margin.marginSize.ui.tooltip=De 0 (nenhum) a 5 (o maior). Um rem \u00E9 o tamanho do texto de base, normalmente 16 p\u00EDxeis: \u00AB3 \u2014 1rem\u00BB corresponde \u00E0 altura de uma linha de texto.
bootstrap5mix_imageAdvancedSettings_description=Defini\u00E7\u00F5es opcionais para a apresenta\u00E7\u00E3o da imagem.
bootstrap5mix_imageAdvancedSettings.imageClass.ui.tooltip=Para integradores: classes CSS adicionadas \u00E0 imagem, separadas por espa\u00E7os.
bootstrap5mix_imageAdvancedSettings.imageStyle.ui.tooltip=Para integradores: declara\u00E7\u00F5es CSS aplicadas apenas a esta imagem, por exemplo max-width: 300px.
bootstrap5mix_imageAdvancedSettings.imageID.ui.tooltip=Para integradores: identificador que permite referenciar esta imagem a partir de uma liga\u00E7\u00E3o, de um script ou de uma folha de estilos. Tem de ser \u00FAnico na p\u00E1gina.
bootstrap5mix_imageAdvancedSettings.responsive.ui.tooltip=A imagem encolhe com o contentor e nunca o ultrapassa. Desmarcar apenas para uma imagem que tenha de manter o tamanho exato.
bootstrap5mix_imageAdvancedSettings.thumbnails.ui.tooltip=Adiciona uma borda fina e uma pequena margem \u00E0 volta da imagem.
bootstrap5mix_imageAdvancedSettings.align.ui.tooltip=\u00ABIn\u00EDcio\u00BB e \u00ABFim\u00BB colocam a imagem de um lado e deixam o texto fluir \u00E0 sua volta (LTR designa uma l\u00EDngua lida da esquerda para a direita; caso contr\u00E1rio os lados invertem-se). \u00ABCentro\u00BB coloca a imagem sozinha na sua linha.
bootstrap5mix_imageAdvancedSettings.alt.ui.tooltip=Descreve a imagem \u00E0s pessoas que n\u00E3o a conseguem ver. Se estiver vazio, \u00E9 utilizado o t\u00EDtulo do ficheiro de imagem.
bootstrap5mix_imageAdvancedSettings.borderRadius.ui.tooltip=Cantos a arredondar. \u00ABC\u00EDrculo\u00BB e \u00ABP\u00EDlula\u00BB ignoram o tamanho abaixo. \u00ABNenhum\u00BB deixa os cantos retos.
bootstrap5mix_imageAdvancedSettings.borderRadiusSize.ui.tooltip=Quanto s\u00E3o arredondados os cantos escolhidos. \u00ABPredefinido\u00BB \u00E9 o arredondamento padr\u00E3o do Bootstrap.
bootstrap5nt_accordion.show.ui.tooltip=O painel est\u00E1 aberto quando a p\u00E1gina \u00E9 carregada. Abrir outro painel fecha-o.
bootstrap5nt_accordions.flush.ui.tooltip=Para um acorde\u00E3o que toca nos limites do contentor, por exemplo num cart\u00E3o ou numa barra lateral.
bootstrap5mix_alert_description=Mostra este conte\u00FAdo numa caixa colorida que chama a aten\u00E7\u00E3o.
bootstrap5mix_alert.backgroundColor.ui.tooltip=A cor transmite um significado: \u00ABSuccess\u00BB \u00E9 verde, \u00ABWarning\u00BB amarelo, \u00ABDanger\u00BB vermelho, \u00ABInfo\u00BB azul-claro. Diz\u00EA-lo tamb\u00E9m no texto: a cor sozinha n\u00E3o \u00E9 percebida por todos. \u00ABLiga\u00E7\u00E3o\u00BB e \u00ABPersonalizado\u00BB s\u00F3 t\u00EAm efeito se a folha de estilos do site os definir.
bootstrap5mix_alert.addDismissButton.ui.tooltip=Os visitantes podem fechar a caixa. Esta volta a aparecer quando a p\u00E1gina \u00E9 recarregada.
bootstrap5mix_advancedBreadcrumb.cssClass.ui.tooltip=Para integradores: classes CSS adicionadas \u00E0 lista das migalhas de p\u00E3o, separadas por espa\u00E7os.
bootstrap5nt_button.buttonType.ui.tooltip=O que acontece ao clicar no bot\u00E3o. As defini\u00E7\u00F5es da a\u00E7\u00E3o escolhida aparecem abaixo.
bootstrap5mix_buttonAdvancedSettings_description=Aspeto do bot\u00E3o.
bootstrap5mix_buttonAdvancedSettings.style.ui.tooltip=Cor do bot\u00E3o. \u00ABPrimary\u00BB serve para a a\u00E7\u00E3o principal da p\u00E1gina; utilizar uma s\u00F3 vez. \u00ABSem fundo\u00BB parece uma simples liga\u00E7\u00E3o. \u00ABPersonalizado\u00BB remove as classes Bootstrap e utiliza apenas o campo de classe CSS.
bootstrap5mix_buttonAdvancedSettings.outline.ui.tooltip=Borda e texto coloridos sobre fundo transparente, para um bot\u00E3o menos destacado.
bootstrap5mix_buttonAdvancedSettings.block.ui.tooltip=O bot\u00E3o ocupa toda a largura do contentor.
bootstrap5mix_buttonAdvancedSettings.state.ui.tooltip=\u00ABAtivo\u00BB mostra o bot\u00E3o como premido. \u00ABDesativado\u00BB torna-o cinzento e deixa de ser clic\u00E1vel.
bootstrap5mix_buttonAdvancedSettings.cssClass.ui.tooltip=Para integradores: classes CSS adicionadas ao bot\u00E3o. Com o estilo \u00ABPersonalizado\u00BB, s\u00E3o as \u00FAnicas classes do bot\u00E3o.
bootstrap5mix_buttonAdvancedSettings.disableTextWrapping.ui.tooltip=O texto mant\u00E9m-se numa s\u00F3 linha, mesmo num contentor estreito.
bootstrap5mix_buttonAdvancedSettings.stretchedLink.ui.tooltip=Ao clicar em qualquer parte do bloco que cont\u00E9m o bot\u00E3o, por exemplo num cart\u00E3o, abre-se a liga\u00E7\u00E3o.
bootstrap5mix_buttonAdvancedSettings.tooltip.ui.tooltip=Texto curto mostrado ao passar o ponteiro sobre o bot\u00E3o ou ao chegar ao bot\u00E3o com o teclado. Num ecr\u00E3 t\u00E1til pode nunca aparecer: n\u00E3o colocar aqui informa\u00E7\u00E3o essencial.
bootstrap5mix_collapse_description=O bot\u00E3o mostra e oculta o conte\u00FAdo adicionado por baixo dele na p\u00E1gina.
bootstrap5mix_collapse.show.ui.tooltip=O conte\u00FAdo est\u00E1 vis\u00EDvel quando a p\u00E1gina \u00E9 carregada.
bootstrap5mix_internalLink_description=O bot\u00E3o abre uma p\u00E1gina ou um ficheiro deste site.
bootstrap5mix_externalLink_description=O bot\u00E3o abre um endere\u00E7o exterior a este site.
bootstrap5mix_externalLink.externalLink.ui.tooltip=Endere\u00E7o completo que come\u00E7a por https://. Um endere\u00E7o de e-mail (mailto:) ou um n\u00FAmero de telefone (tel:) tamb\u00E9m funcionam.
bootstrap5mix_modal_description=O bot\u00E3o abre uma janela por cima da p\u00E1gina. Adicionar o conte\u00FAdo da janela a partir da p\u00E1gina, dentro do bot\u00E3o.
bootstrap5mix_modal.modalTitle.ui.tooltip=Mostrado no topo da janela. Sem t\u00EDtulo, a janela n\u00E3o tem cabe\u00E7alho nem cruz de fecho.
bootstrap5mix_modal.closeText.ui.tooltip=Texto do bot\u00E3o no fundo da janela. \u00ABFechar\u00BB se estiver vazio.
bootstrap5mix_modal.staticBackdrop.ui.tooltip=A janela s\u00F3 se fecha com os seus pr\u00F3prios bot\u00F5es, para um conte\u00FAdo que tem de ser lido.
bootstrap5mix_modal.verticallyCentered.ui.tooltip=Centra a janela verticalmente no ecr\u00E3 em vez de a colocar no topo.
bootstrap5mix_popover_description=O bot\u00E3o mostra um pequeno bal\u00E3o junto a si. Um clique noutro ponto fecha-o.
bootstrap5mix_popover.direction.ui.tooltip=Lado do bot\u00E3o onde o bal\u00E3o aparece. Passa para outro lado quando n\u00E3o h\u00E1 espa\u00E7o suficiente.
bootstrap5mix_popover.html.ui.tooltip=O conte\u00FAdo \u00E9 interpretado como HTML e n\u00E3o como texto simples. Marcar apenas para um conte\u00FAdo escrito por si.
bootstrap5mix_Offcanvas_description=O bot\u00E3o abre um painel que desliza a partir de um dos lados do ecr\u00E3. Adicionar o conte\u00FAdo do painel a partir da p\u00E1gina, dentro do bot\u00E3o.
bootstrap5mix_Offcanvas.OffcanvasTitle.ui.tooltip=Mostrado no topo do painel, ao lado da cruz de fecho.
bootstrap5mix_Offcanvas.enableBackdrop.ui.tooltip=Escurece a p\u00E1gina atr\u00E1s do painel; um clique na p\u00E1gina escurecida fecha o painel.
bootstrap5mix_Offcanvas.enableBodyScrolling.ui.tooltip=Continua a ser poss\u00EDvel fazer scroll na p\u00E1gina que est\u00E1 por tr\u00E1s do painel.
bootstrap5nt_buttonGroup.vertical.ui.tooltip=Os bot\u00F5es ficam uns por baixo dos outros em vez de lado a lado.
bootstrap5nt_card.headerSize.ui.tooltip=N\u00EDvel do t\u00EDtulo na estrutura da p\u00E1gina (H2 sob o t\u00EDtulo da p\u00E1gina, H3 sob um H2\u2026). N\u00E3o altera o tamanho do texto. \u00ABPredefinido\u00BB \u00E9 um simples par\u00E1grafo, n\u00E3o um t\u00EDtulo.
bootstrap5nt_card.footer.ui.tooltip=Texto curto mostrado no fundo do cart\u00E3o. Para um conte\u00FAdo mais rico, marcar \u00ABRodap\u00E9 enriquecido\u00BB nas defini\u00E7\u00F5es avan\u00E7adas.
bootstrap5mix_colors_description=Cores do cart\u00E3o. Verificar se o texto continua leg\u00EDvel sobre o fundo escolhido.
bootstrap5mix_cardAdvancedSettings.cssClass.ui.tooltip=Para integradores: substitui a classe \u00ABcard\u00BB do bloco exterior. Manter \u00ABcard\u00BB, exceto se o estilo do cart\u00E3o for totalmente refeito.
bootstrap5mix_cardAdvancedSettings.cardHeaderCssClass.ui.tooltip=Para integradores: substitui a classe \u00ABcard-header\u00BB do cabe\u00E7alho.
bootstrap5mix_cardAdvancedSettings.cardBodyCssClass.ui.tooltip=Para integradores: substitui a classe \u00ABcard-body\u00BB do corpo.
bootstrap5mix_cardAdvancedSettings.freeFooter.ui.tooltip=Substitui o texto do rodap\u00E9 por uma \u00E1rea onde \u00E9 poss\u00EDvel adicionar qualquer conte\u00FAdo a partir da p\u00E1gina.
bootstrap5nt_carouselItem.image.ui.tooltip=Utilizar imagens com as mesmas propor\u00E7\u00F5es em todos os diapositivos; caso contr\u00E1rio, o carrossel muda de altura de um diapositivo para o seguinte.
bootstrap5nt_carouselItem.caption.ui.tooltip=Mostrada sobre a imagem, por baixo do t\u00EDtulo.
bootstrap5mix_advancedCarouselItem.titleColor.ui.tooltip=Escolher uma cor que se mantenha leg\u00EDvel sobre a imagem.
bootstrap5mix_advancedCarouselItem.captionColor.ui.tooltip=Escolher uma cor que se mantenha leg\u00EDvel sobre a imagem.
bootstrap5mix_advancedCarouselItem.carouselItemClass.ui.tooltip=Para integradores: classes CSS adicionadas a este diapositivo.
bootstrap5mix_advancedCarouselItem.interval.ui.tooltip=Tempo durante o qual este diapositivo fica vis\u00EDvel, em milissegundos (5000 = 5 segundos). Se o campo ficar vazio, aplica-se o tempo de apresenta\u00E7\u00E3o definido para o carrossel.
bootstrap5mix_carouselAdvancedSettings_description=Comportamento e controlos do carrossel.
bootstrap5mix_carouselAdvancedSettings.useIndicators.ui.tooltip=Pequenas barras na parte inferior do carrossel, uma por diapositivo, para abrir diretamente o diapositivo correspondente.
bootstrap5mix_carouselAdvancedSettings.interval.ui.tooltip=Em milissegundos: 5000 = 5 segundos, o valor predefinido.
bootstrap5mix_carouselAdvancedSettings.keyboard.ui.tooltip=As teclas de seta para a esquerda e para a direita mudam de diapositivo quando se chega ao carrossel com o teclado.
bootstrap5mix_carouselAdvancedSettings.pause.ui.tooltip=Os diapositivos deixam de mudar enquanto o ponteiro estiver sobre o carrossel.
bootstrap5mix_carouselAdvancedSettings.ride.ui.tooltip=Os diapositivos mudam sozinhos. \u00C9 adicionado um bot\u00E3o de pausa para os utilizadores de teclado e de leitores de ecr\u00E3. Se estiver desmarcado, s\u00E3o os visitantes que mudam de diapositivo.
bootstrap5mix_carouselAdvancedSettings.wrap.ui.tooltip=Depois do \u00FAltimo diapositivo, o carrossel recome\u00E7a no primeiro.
bootstrap5mix_carouselAdvancedSettings.fade.ui.tooltip=A passagem para o diapositivo seguinte faz-se por dissolu\u00E7\u00E3o, em vez de o diapositivo deslizar para o lado.
bootstrap5mix_carouselAdvancedSettings.carouselClass.ui.tooltip=Para integradores: classes CSS adicionadas ao carrossel.
bootstrap5mix_carouselAdvancedSettings.variant.ui.tooltip=Cor das setas, dos indicadores e das legendas. Escolher a que contrasta com as imagens.
bootstrap5mix_figureAdvancedSettings.captionAlignment.ui.tooltip=Posi\u00E7\u00E3o da legenda por baixo da imagem.
bootstrap5mix_createSection_description=Envolve todo este layout, com tudo o que cont\u00E9m, num elemento HTML adicional que indica o que \u00E9 esta parte da p\u00E1gina.
bootstrap5mix_createSection.sectionElement.ui.tooltip=A etiqueta HTML colocada \u00E0 volta deste layout e do seu conte\u00FAdo. Escolher em fun\u00E7\u00E3o do significado: section para uma parte tem\u00E1tica, article para um conte\u00FAdo aut\u00F3nomo, aside para um conte\u00FAdo complementar, nav para uma navega\u00E7\u00E3o, header e footer para o topo e o fundo de um bloco, main para o conte\u00FAdo principal da p\u00E1gina (apenas um por p\u00E1gina). Utilizar div quando nenhum significado se aplica.
bootstrap5mix_createSection.sectionStyle.ui.tooltip=Opcional. Para integradores: declara\u00E7\u00F5es CSS aplicadas apenas a este elemento, por exemplo background-color: #f5f5f5; padding-top: 2rem.
bootstrap5mix_createSection.sectionRole.ui.tooltip=Opcional, para especialistas em acessibilidade. O tipo de elemento escolhido acima \u00E9 normalmente suficiente; s\u00F3 \u00E9 \u00FAtil indicar uma fun\u00E7\u00E3o se for escolhido o elemento div.
bootstrap5mix_createSection.sectionAria.ui.tooltip=Opcional. Um nome curto lido pelos leitores de ecr\u00E3 para distinguir esta parte da p\u00E1gina das outras, por exemplo \u00AB\u00DAltimas not\u00EDcias\u00BB. N\u00E3o \u00E9 mostrado.
bootstrap5mix_createContainer_description=Centra o conte\u00FAdo e limita a sua largura. Sem contentor, o conte\u00FAdo ocupa toda a largura dispon\u00EDvel.
bootstrap5mix_createContainer.containerType.ui.tooltip=\u00ABLargura fixa\u00BB centra o conte\u00FAdo e d\u00E1-lhe uma largura m\u00E1xima que cresce por patamares com o ecr\u00E3. \u00ABFluido\u00BB ocupa sempre toda a largura. Com as outras op\u00E7\u00F5es, o conte\u00FAdo ocupa toda a largura nos ecr\u00E3s mais estreitos do que o limite indicado. A partir desse limite, chamado breakpoint, a largura do conte\u00FAdo \u00E9 fixa.
bootstrap5mix_createRow_description=Divide este layout em colunas colocadas lado a lado. Em ecr\u00E3s pequenos, as colunas ficam umas por baixo das outras.
bootstrap5mix_createRow.typeOfGrid.ui.tooltip=\u00ABLinha vazia\u00BB: uma \u00FAnica \u00E1rea. \u00ABDisposi\u00E7\u00E3o predefinida\u00BB: escolher entre larguras de coluna j\u00E1 prontas. \u00ABDisposi\u00E7\u00E3o personalizada\u00BB: definir cada coluna com classes Bootstrap.
bootstrap5mix_createRow.rowVerticalAlignment.ui.tooltip=Alinhamento das colunas de alturas diferentes: \u00ABSuperior\u00BB, \u00ABMeio\u00BB ou \u00ABInferior\u00BB. \u00ABPredefinido\u00BB d\u00E1 a todas a altura da mais alta.
bootstrap5mix_createRow.rowHorizontalAlignment.ui.tooltip=Posi\u00E7\u00E3o das colunas quando, juntas, s\u00E3o mais estreitas do que a linha. Sem efeito vis\u00EDvel quando as colunas preenchem a linha, como nas disposi\u00E7\u00F5es predefinidas.
bootstrap5mix_createRow.horizontalGutters.ui.tooltip=\u00ABNenhum\u00BB: as colunas tocam-se. De 1 a 5: um espa\u00E7o cada vez maior. \u00ABPredefinido\u00BB \u00E9 o espa\u00E7o padr\u00E3o do Bootstrap (1,5rem, cerca de 24 p\u00EDxeis).
bootstrap5mix_createRow.verticalGutters.ui.tooltip=Espa\u00E7o entre as colunas quando passam umas para baixo das outras, por exemplo em ecr\u00E3s pequenos. \u00ABNenhum\u00BB: sem espa\u00E7o. De 1 a 5: cada vez maior. \u00ABPredefinido\u00BB: sem espa\u00E7o.
bootstrap5mix_predefinedGrid.grid.ui.tooltip=Cada n\u00FAmero \u00E9 a largura de uma coluna; uma linha completa vale 12. \u00AB4 / 8\u00BB \u00E9 uma coluna estreita seguida de outra com o dobro da largura; \u00AB12\u00BB \u00E9 uma \u00FAnica coluna.
bootstrap5mix_createAbsoluteAreas_description=As colunas mostram um conte\u00FAdo guardado numa p\u00E1gina situada mais acima na \u00E1rvore do site, em vez de um conte\u00FAdo pr\u00F3prio: o mesmo conte\u00FAdo aparece em todas as p\u00E1ginas abaixo dessa p\u00E1gina.
bootstrap5mix_createAbsoluteAreas.level.ui.tooltip=\u00AB0 \u2014 P\u00E1gina inicial\u00BB \u00E9 a p\u00E1gina inicial, 1 as p\u00E1ginas diretamente abaixo, e assim sucessivamente. O conte\u00FAdo \u00E9 editado apenas nessa p\u00E1gina; nas p\u00E1ginas abaixo \u00E9 apresentado e n\u00E3o pode ser alterado.
bootstrap5mix_listLimit_description=Limita o n\u00FAmero de conte\u00FAdos mostrados em cada coluna.
bootstrap5mix_listLimit.listLimit.ui.tooltip=Os conte\u00FAdos para al\u00E9m deste n\u00FAmero n\u00E3o s\u00E3o apresentados, e os editores n\u00E3o podem adicionar mais. \u00ABSem limite\u00BB mostra tudo.
bootstrap5nt_navbar.root.ui.tooltip=A p\u00E1gina cujas subp\u00E1ginas formam o menu. \u00ABP\u00E1gina inicial\u00BB: todo o site. \u00ABP\u00E1gina atual\u00BB: as p\u00E1ginas abaixo da p\u00E1gina apresentada. \u00ABP\u00E1gina m\u00E3e\u00BB: as p\u00E1ginas ao mesmo n\u00EDvel da p\u00E1gina apresentada. \u00ABP\u00E1gina personalizada\u00BB: uma p\u00E1gina \u00E0 escolha.
bootstrap5mix_navbarGlobalSettings_description=O que a barra de navega\u00E7\u00E3o cont\u00E9m.
bootstrap5mix_navbarGlobalSettings.addLoginButton.ui.tooltip=Adiciona um bot\u00E3o \u00ABIniciar sess\u00E3o\u00BB; depois de iniciada a sess\u00E3o, um menu com o nome do utilizador e \u00ABTerminar sess\u00E3o\u00BB.
bootstrap5mix_navbarGlobalSettings.addLanguageButton.ui.tooltip=Adiciona um menu para ler a p\u00E1gina noutro idioma. Mostrado apenas quando o site tem pelo menos dois idiomas.
bootstrap5mix_navbarGlobalSettings.addColorModeButton.ui.tooltip=Adiciona um menu que permite aos visitantes escolher uma apresenta\u00E7\u00E3o clara ou escura, ou seguir a defini\u00E7\u00E3o do seu dispositivo. A escolha fica memorizada.
bootstrap5mix_navbarGlobalSettings.maxlevel.ui.tooltip=1 mostra apenas o primeiro n\u00EDvel de p\u00E1ginas. Com 2, as respetivas subp\u00E1ginas aparecem em menus suspensos. Com 3 ou mais, s\u00E3o apresentados submenus em v\u00E1rios n\u00EDveis.
bootstrap5mix_navbarGlobalSettings.addContainerWithinTheNavbar.ui.tooltip=Alinha o conte\u00FAdo da barra com o conte\u00FAdo da p\u00E1gina. Desmarcar para uma barra cujo conte\u00FAdo ocupa toda a largura.
bootstrap5mix_customizeNavbar_description=Para integradores: as classes CSS de cada parte da barra de navega\u00E7\u00E3o. Os campos vazios utilizam os valores predefinidos do Bootstrap.
bootstrap5mix_customizeNavbar.navClass.ui.tooltip=Define as cores e o tamanho de ecr\u00E3 a partir do qual o menu \u00E9 mostrado por inteiro: navbar-expand-lg expande-o em ecr\u00E3s grandes. Para uma barra que acompanha o modo escuro, utilizar bg-body-tertiary.
bootstrap5mix_brand_description=Nome e logotipo mostrados no in\u00EDcio desta barra de navega\u00E7\u00E3o. Ignorado quando existe uma marca definida no site.
bootstrap5mix_brand.brandText.ui.tooltip=Mostrado ao lado do logotipo. Com logotipo e sem texto, o nome do site descreve o logotipo \u00E0s pessoas que n\u00E3o o conseguem ver.
bootstrap5mix_brand.brandImageMobile.ui.tooltip=Opcional. Mostrado em vez do logotipo de desktop enquanto o menu est\u00E1 recolhido.
bootstrap5mix_siteBrand_description=Nome e logotipo mostrados no in\u00EDcio de todas as barras de navega\u00E7\u00E3o do site. Substitui a marca definida em cada barra de navega\u00E7\u00E3o.
bootstrap5mix_siteBrand.brandText.ui.tooltip=Mostrado ao lado do logotipo. Com logotipo e sem texto, o nome do site descreve o logotipo \u00E0s pessoas que n\u00E3o o conseguem ver.
bootstrap5mix_siteBrand.brandImageMobile.ui.tooltip=Opcional. Mostrado em vez do logotipo de desktop enquanto o menu est\u00E1 recolhido.
bootstrap5mix_siteColorMode_description=Apresenta\u00E7\u00E3o clara ou escura de todo o site.
bootstrap5mix_siteColorMode.colorMode.ui.tooltip=O modo aplicado aos visitantes que n\u00E3o escolheram nenhum com o seletor da barra de navega\u00E7\u00E3o.
bootstrap5mix_customRootPage.customRootPage.ui.tooltip=O menu lista as subp\u00E1ginas desta p\u00E1gina.
bootstrap5nt_pagination.displayPager.ui.tooltip=Se estiver desmarcado, a lista continua dividida em p\u00E1ginas, mas os visitantes n\u00E3o t\u00EAm liga\u00E7\u00F5es para as outras p\u00E1ginas.
bootstrap5mix_advancedPagination.nbOfPages.ui.tooltip=Para al\u00E9m deste n\u00FAmero, a barra mostra apenas as p\u00E1ginas \u00E0 volta da p\u00E1gina atual.
bootstrap5mix_advancedPagination.nbOfPagesInEdit.ui.tooltip=Em modo de edi\u00E7\u00E3o, a lista mostra este n\u00FAmero de itens para que seja poss\u00EDvel chegar a todos sem mudar de p\u00E1gina.
bootstrap5nt_progress.max.ui.tooltip=A parte preenchida \u00E9 proporcional ao valor em rela\u00E7\u00E3o ao m\u00E1ximo. Com um valor de 30 e um m\u00E1ximo de 120, fica preenchido um quarto da barra.
bootstrap5nt_progress.striped.ui.tooltip=Adiciona riscas diagonais \u00E0 parte preenchida.
bootstrap5nt_tabs.type.ui.tooltip=Aspeto da barra de separadores. Cada separador \u00E9 uma lista de conte\u00FAdos adicionada a este componente; o t\u00EDtulo da lista \u00E9 o texto do separador.
bootstrap5nt_tabs.align.ui.tooltip=Posi\u00E7\u00E3o dos separadores na barra. Ambas as op\u00E7\u00F5es ocupam toda a largura da barra. Com \u00ABPreenchimento\u00BB, a largura de cada separador depende do comprimento do texto. Com \u00ABJustificado\u00BB, todos t\u00EAm a mesma largura.
bootstrap5nt_tabs.useListNameAsAnchor.ui.tooltip=O endere\u00E7o da p\u00E1gina pode abrir um separador espec\u00EDfico (\u2026#nome-da-lista). Se estiver desmarcado, \u00E9 utilizado um identificador t\u00E9cnico em vez do nome.
bootstrap5mix_Offcanvas.placement.ui.tooltip=Margem do ecr\u00E3 de onde vem o painel. \u00ABIn\u00EDcio\u00BB \u00E9 a esquerda e \u00ABFim\u00BB a direita nas l\u00EDnguas lidas da esquerda para a direita (LTR); caso contr\u00E1rio invertem-se.
bootstrap5mix_colors.textColor.ui.tooltip=\u00ABBody\u00BB \u00E9 a cor normal do texto do site; \u00ABAtenuado\u00BB um cinzento mais claro para texto secund\u00E1rio. Verificar que o texto continua leg\u00EDvel sobre o fundo escolhido.
bootstrap5mix_colors.backgroundColor.ui.tooltip=\u00ABPredefinido\u00BB mant\u00E9m o fundo padr\u00E3o de um cart\u00E3o.
bootstrap5mix_modal.modalSize.ui.tooltip=Largura da janela em ecr\u00E3s grandes. Num telem\u00F3vel ocupa sempre a largura do ecr\u00E3.
bootstrap5mix_advancedPagination.align.ui.tooltip=Posi\u00E7\u00E3o da barra de pagina\u00E7\u00E3o na largura do seu contentor.
bootstrap5nt_card.textAlign.ui.tooltip=Alinhamento do texto de todo o cart\u00E3o. \u00ABIn\u00EDcio\u00BB \u00E9 a esquerda nas l\u00EDnguas lidas da esquerda para a direita.
