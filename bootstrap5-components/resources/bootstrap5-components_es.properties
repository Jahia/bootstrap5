bootstrap5nt_buttonGroup.jcr_title.ui.tooltip=No se muestra. Indica a los usuarios de lectores de pantalla qu\u00E9 tienen en com\u00FAn los botones, por ejemplo \u00ABCompartir\u00BB.
bootstrap5mix_padding_description=Espacio dentro del componente, entre su borde y su contenido.
bootstrap5mix_padding.paddingWhere.ui.tooltip=Lados que reciben el espacio. \u00ABInicio\u00BB y \u00ABFin\u00BB son la izquierda y la derecha en los idiomas que se leen de izquierda a derecha, y se invierten en los que se leen de derecha a izquierda.
bootstrap5mix_padding.paddingSize.ui.tooltip=De 0 (ninguno) a 5 (el mayor). Un rem es el tama\u00F1o del texto base, normalmente 16 p\u00EDxeles: \u00AB3 \u2014 1rem\u00BB equivale a la altura de una l\u00EDnea de texto.
bootstrap5mix_margin_description=Espacio fuera del componente, entre este y sus vecinos.
bootstrap5mix_margin.marginWhere.ui.tooltip=Lados que reciben el espacio. \u00ABInicio\u00BB y \u00ABFin\u00BB son la izquierda y la derecha en los idiomas que se leen de izquierda a derecha, y se invierten en los que se leen de derecha a izquierda.
bootstrap5mix_margin.marginSize.ui.tooltip=De 0 (ninguno) a 5 (el mayor). Un rem es el tama\u00F1o del texto base, normalmente 16 p\u00EDxeles: \u00AB3 \u2014 1rem\u00BB equivale a la altura de una l\u00EDnea de texto.
bootstrap5mix_imageAdvancedSettings_description=Ajustes opcionales de la presentaci\u00F3n de la imagen.
bootstrap5mix_imageAdvancedSettings.imageClass.ui.tooltip=Para integradores: clases CSS a\u00F1adidas a la imagen, separadas por espacios.
bootstrap5mix_imageAdvancedSettings.imageStyle.ui.tooltip=Para integradores: declaraciones CSS aplicadas solo a esta imagen, por ejemplo max-width: 300px.
bootstrap5mix_imageAdvancedSettings.imageID.ui.tooltip=Para integradores: identificador que permite apuntar a esta imagen desde un enlace, un script o una hoja de estilo. Debe ser \u00FAnico en la p\u00E1gina.
bootstrap5mix_imageAdvancedSettings.responsive.ui.tooltip=La imagen se reduce con su contenedor y nunca lo desborda. Desmarque solo para una imagen que deba conservar su tama\u00F1o exacto.
bootstrap5mix_imageAdvancedSettings.thumbnails.ui.tooltip=A\u00F1ade un borde fino y un peque\u00F1o margen alrededor de la imagen.
bootstrap5mix_imageAdvancedSettings.align.ui.tooltip=\u00ABInicio\u00BB y \u00ABFin\u00BB colocan la imagen a un lado y dejan que el texto fluya a su alrededor (LTR designa un idioma que se lee de izquierda a derecha; si no, los lados se invierten). \u00ABCentro\u00BB coloca la imagen sola en su l\u00EDnea.
bootstrap5mix_imageAdvancedSettings.alt.ui.tooltip=Describe la imagen a las personas que no pueden verla. Si est\u00E1 vac\u00EDo, se usa el t\u00EDtulo del archivo de imagen.
bootstrap5mix_imageAdvancedSettings.borderRadius.ui.tooltip=Esquinas que se redondean. \u00ABC\u00EDrculo\u00BB y \u00ABP\u00EDldora\u00BB ignoran el tama\u00F1o de abajo. \u00ABNinguno\u00BB deja las esquinas rectas.
bootstrap5mix_imageAdvancedSettings.borderRadiusSize.ui.tooltip=Cu\u00E1nto se redondean las esquinas elegidas. \u00ABPredeterminado\u00BB es el redondeo est\u00E1ndar de Bootstrap.
bootstrap5nt_accordion.show.ui.tooltip=El panel est\u00E1 abierto al cargar la p\u00E1gina. Al abrir otro panel, se cierra el que estaba abierto.
bootstrap5nt_accordions.flush.ui.tooltip=Para un acorde\u00F3n que toca los bordes de su contenedor, por ejemplo en una tarjeta o una barra lateral.
bootstrap5mix_alert_description=Muestra este contenido en un recuadro de color que llama la atenci\u00F3n.
bootstrap5mix_alert.backgroundColor.ui.tooltip=El color transmite un significado: \u00ABSuccess\u00BB es verde, \u00ABWarning\u00BB amarillo, \u00ABDanger\u00BB rojo, \u00ABInfo\u00BB azul claro. D\u00EDgalo tambi\u00E9n en el texto, no todo el mundo percibe el color. \u00ABEnlace\u00BB y \u00ABPersonalizado\u00BB solo tienen efecto si la hoja de estilos de su sitio los define.
bootstrap5mix_alert.addDismissButton.ui.tooltip=Los visitantes pueden cerrar el recuadro. Vuelve a aparecer al cargar de nuevo la p\u00E1gina.
bootstrap5mix_advancedBreadcrumb.cssClass.ui.tooltip=Para integradores: clases CSS a\u00F1adidas a la lista de la ruta de navegaci\u00F3n, separadas por espacios.
bootstrap5nt_button.buttonType.ui.tooltip=Lo que ocurre al hacer clic en el bot\u00F3n. Los ajustes de la acci\u00F3n elegida aparecen debajo.
bootstrap5mix_buttonAdvancedSettings_description=Apariencia del bot\u00F3n.
bootstrap5mix_buttonAdvancedSettings.style.ui.tooltip=Color del bot\u00F3n. \u00ABPrimary\u00BB sirve para la acci\u00F3n principal de la p\u00E1gina; \u00FAselo una sola vez. \u00ABSin fondo\u00BB parece un simple enlace. \u00ABPersonalizado\u00BB quita las clases de Bootstrap y solo usa el campo de clase CSS.
bootstrap5mix_buttonAdvancedSettings.outline.ui.tooltip=Borde y texto de color sobre fondo transparente, para un bot\u00F3n menos destacado.
bootstrap5mix_buttonAdvancedSettings.block.ui.tooltip=El bot\u00F3n ocupa toda la anchura de su contenedor.
bootstrap5mix_buttonAdvancedSettings.state.ui.tooltip=\u00ABActivo\u00BB muestra el bot\u00F3n como pulsado. \u00ABDesactivado\u00BB lo aten\u00FAa y ya no se puede pulsar.
bootstrap5mix_buttonAdvancedSettings.cssClass.ui.tooltip=Para integradores: clases CSS a\u00F1adidas al bot\u00F3n. Con el estilo \u00ABPersonalizado\u00BB, son las \u00FAnicas clases del bot\u00F3n.
bootstrap5mix_buttonAdvancedSettings.disableTextWrapping.ui.tooltip=El texto se mantiene en una sola l\u00EDnea, incluso en un contenedor estrecho.
bootstrap5mix_buttonAdvancedSettings.stretchedLink.ui.tooltip=Al hacer clic en cualquier parte del bloque que contiene el bot\u00F3n, por ejemplo en una tarjeta, se abre el enlace.
bootstrap5mix_buttonAdvancedSettings.tooltip.ui.tooltip=Texto breve que se muestra al pasar el puntero sobre el bot\u00F3n o al situarse sobre el bot\u00F3n con el teclado. En pantallas t\u00E1ctiles puede no verse nunca: no incluya en \u00E9l informaci\u00F3n esencial.
bootstrap5mix_collapse_description=El bot\u00F3n muestra y oculta el contenido que usted a\u00F1ade debajo de \u00E9l en la p\u00E1gina.
bootstrap5mix_collapse.show.ui.tooltip=El contenido est\u00E1 visible al cargar la p\u00E1gina.
bootstrap5mix_internalLink_description=El bot\u00F3n abre una p\u00E1gina o un archivo de este sitio.
bootstrap5mix_externalLink_description=El bot\u00F3n abre una direcci\u00F3n externa a este sitio.
bootstrap5mix_externalLink.externalLink.ui.tooltip=Direcci\u00F3n completa que empieza por https://. Tambi\u00E9n funcionan una direcci\u00F3n de correo electr\u00F3nico (mailto:) o un n\u00FAmero de tel\u00E9fono (tel:).
bootstrap5mix_modal_description=El bot\u00F3n abre una ventana sobre la p\u00E1gina. A\u00F1ada el contenido de la ventana desde la p\u00E1gina, dentro del bot\u00F3n.
bootstrap5mix_modal.modalTitle.ui.tooltip=Se muestra en la parte superior de la ventana. Sin t\u00EDtulo, la ventana no tiene encabezado ni aspa de cierre.
bootstrap5mix_modal.closeText.ui.tooltip=Texto del bot\u00F3n situado en la parte inferior de la ventana. \u00ABCerrar\u00BB si est\u00E1 vac\u00EDo.
bootstrap5mix_modal.staticBackdrop.ui.tooltip=La ventana solo se cierra con sus propios botones, para un contenido que debe leerse.
bootstrap5mix_modal.verticallyCentered.ui.tooltip=Centra la ventana verticalmente en la pantalla en lugar de colocarla en la parte superior.
bootstrap5mix_popover_description=El bot\u00F3n muestra un peque\u00F1o bocadillo a su lado. Un clic en otro lugar lo cierra.
bootstrap5mix_popover.direction.ui.tooltip=Lado del bot\u00F3n en el que aparece el bocadillo. Pasa a otro lado cuando no hay espacio suficiente.
bootstrap5mix_popover.html.ui.tooltip=El contenido se interpreta como HTML y no como texto sin formato. M\u00E1rquelo solo para un contenido que haya escrito usted.
bootstrap5mix_Offcanvas_description=El bot\u00F3n abre un panel que se desliza desde un borde de la pantalla. A\u00F1ada el contenido del panel desde la p\u00E1gina, dentro del bot\u00F3n.
bootstrap5mix_Offcanvas.OffcanvasTitle.ui.tooltip=Se muestra en la parte superior del panel, junto al aspa de cierre.
bootstrap5mix_Offcanvas.enableBackdrop.ui.tooltip=Oscurece la p\u00E1gina detr\u00E1s del panel; un clic en la p\u00E1gina oscurecida cierra el panel.
bootstrap5mix_Offcanvas.enableBodyScrolling.ui.tooltip=La p\u00E1gina situada detr\u00E1s del panel se puede seguir desplazando.
bootstrap5nt_buttonGroup.vertical.ui.tooltip=Los botones se colocan uno debajo de otro en lugar de uno al lado de otro.
bootstrap5nt_card.headerSize.ui.tooltip=Nivel del t\u00EDtulo en el esquema de la p\u00E1gina (H2 bajo el t\u00EDtulo de la p\u00E1gina, H3 bajo un H2\u2026). No cambia el tama\u00F1o del texto. \u00ABPredeterminado\u00BB es un simple p\u00E1rrafo, no un t\u00EDtulo.
bootstrap5nt_card.footer.ui.tooltip=Texto breve que se muestra en la parte inferior de la tarjeta. Para un contenido m\u00E1s rico, marque \u00ABPie de p\u00E1gina enriquecido\u00BB en los ajustes avanzados.
bootstrap5mix_colors_description=Colores de la tarjeta. Compruebe que el texto sigue siendo legible sobre el fondo elegido.
bootstrap5mix_cardAdvancedSettings.cssClass.ui.tooltip=Para integradores: sustituye la clase \u00ABcard\u00BB del bloque exterior. Mantenga \u00ABcard\u00BB salvo que redise\u00F1e por completo el estilo de la tarjeta.
bootstrap5mix_cardAdvancedSettings.cardHeaderCssClass.ui.tooltip=Para integradores: sustituye la clase \u00ABcard-header\u00BB del encabezado.
bootstrap5mix_cardAdvancedSettings.cardBodyCssClass.ui.tooltip=Para integradores: sustituye la clase \u00ABcard-body\u00BB del cuerpo.
bootstrap5mix_cardAdvancedSettings.freeFooter.ui.tooltip=Sustituye el texto del pie por un \u00E1rea en la que se puede a\u00F1adir cualquier contenido desde la p\u00E1gina.
bootstrap5nt_carouselItem.image.ui.tooltip=Use im\u00E1genes de las mismas proporciones en todas las diapositivas; de lo contrario, el carrusel cambia de altura de una diapositiva a otra.
bootstrap5nt_carouselItem.caption.ui.tooltip=Se muestra sobre la imagen, debajo del t\u00EDtulo.
bootstrap5mix_advancedCarouselItem.titleColor.ui.tooltip=Elija un color que siga siendo legible sobre la imagen.
bootstrap5mix_advancedCarouselItem.captionColor.ui.tooltip=Elija un color que siga siendo legible sobre la imagen.
bootstrap5mix_advancedCarouselItem.carouselItemClass.ui.tooltip=Para integradores: clases CSS a\u00F1adidas a esta diapositiva.
bootstrap5mix_advancedCarouselItem.interval.ui.tooltip=Tiempo que esta diapositiva permanece en pantalla, en milisegundos (5000 = 5 segundos). Si el campo se deja vac\u00EDo, se usa la duraci\u00F3n de visualizaci\u00F3n del carrusel.
bootstrap5mix_carouselAdvancedSettings_description=Comportamiento y controles del carrusel.
bootstrap5mix_carouselAdvancedSettings.useIndicators.ui.tooltip=Peque\u00F1as barras en la parte inferior, una por diapositiva, para ir directamente a una diapositiva.
bootstrap5mix_carouselAdvancedSettings.interval.ui.tooltip=En milisegundos: 5000 = 5 segundos, el valor predeterminado.
bootstrap5mix_carouselAdvancedSettings.keyboard.ui.tooltip=Las teclas de flecha izquierda y derecha cambian de diapositiva cuando se llega al carrusel con el teclado.
bootstrap5mix_carouselAdvancedSettings.pause.ui.tooltip=Las diapositivas dejan de cambiar mientras el puntero est\u00E1 sobre el carrusel.
bootstrap5mix_carouselAdvancedSettings.ride.ui.tooltip=Las diapositivas cambian solas. Se a\u00F1ade un bot\u00F3n de pausa para los usuarios de teclado y de lectores de pantalla. Si no est\u00E1 marcado, los visitantes cambian de diapositiva por s\u00ED mismos.
bootstrap5mix_carouselAdvancedSettings.wrap.ui.tooltip=Despu\u00E9s de la \u00FAltima diapositiva, el carrusel vuelve a empezar por la primera.
bootstrap5mix_carouselAdvancedSettings.fade.ui.tooltip=Una diapositiva se funde con la siguiente en lugar de deslizarse hacia un lado.
bootstrap5mix_carouselAdvancedSettings.carouselClass.ui.tooltip=Para integradores: clases CSS a\u00F1adidas al carrusel.
bootstrap5mix_carouselAdvancedSettings.variant.ui.tooltip=Color de las flechas, los indicadores y los pies de imagen. Elija el que contraste con sus im\u00E1genes.
bootstrap5mix_figureAdvancedSettings.captionAlignment.ui.tooltip=Posici\u00F3n del pie de imagen debajo de la imagen.
bootstrap5mix_createSection_description=Envuelve todo este dise\u00F1o, con todo lo que contiene, en un elemento HTML adicional que indica qu\u00E9 es esta parte de la p\u00E1gina.
bootstrap5mix_createSection.sectionElement.ui.tooltip=La etiqueta HTML que rodea este dise\u00F1o y su contenido. El\u00EDjala por su significado: section para una parte tem\u00E1tica, article para un contenido aut\u00F3nomo, aside para un contenido complementario, nav para una navegaci\u00F3n, header y footer para la parte superior e inferior de un bloque, main para el contenido principal de la p\u00E1gina (solo uno por p\u00E1gina). Use div cuando no se aplique ning\u00FAn significado.
bootstrap5mix_createSection.sectionStyle.ui.tooltip=Opcional. Para integradores: declaraciones CSS aplicadas solo a este elemento, por ejemplo background-color: #f5f5f5; padding-top: 2rem.
bootstrap5mix_createSection.sectionRole.ui.tooltip=Opcional, para especialistas en accesibilidad. El tipo de elemento elegido arriba suele bastar; un rol solo resulta \u00FAtil si se elige div.
bootstrap5mix_createSection.sectionAria.ui.tooltip=Opcional. Un nombre corto que leen los lectores de pantalla para distinguir esta parte de la p\u00E1gina de las dem\u00E1s, por ejemplo \u00AB\u00DAltimas noticias\u00BB. No se muestra.
bootstrap5mix_createContainer_description=Centra el contenido y limita su anchura. Sin contenedor, el contenido ocupa toda la anchura disponible.
bootstrap5mix_createContainer.containerType.ui.tooltip=\u00ABAnchura fija\u00BB centra el contenido y le da una anchura m\u00E1xima que crece por tramos con la pantalla. \u00ABFluido\u00BB ocupa siempre toda la anchura. Con las dem\u00E1s opciones, el contenido ocupa toda la anchura hasta el umbral indicado. A partir de ese umbral, llamado punto de ruptura, el contenido tiene una anchura fija.
bootstrap5mix_createRow_description=Divide este dise\u00F1o en columnas colocadas una al lado de otra. En pantallas peque\u00F1as, las columnas pasan una debajo de otra.
bootstrap5mix_createRow.typeOfGrid.ui.tooltip=\u00ABFila vac\u00EDa\u00BB: una sola zona. \u00ABDisposici\u00F3n predefinida\u00BB: elija entre anchuras de columna ya preparadas. \u00ABDisposici\u00F3n personalizada\u00BB: defina usted cada columna con clases de Bootstrap.
bootstrap5mix_createRow.rowVerticalAlignment.ui.tooltip=Alineaci\u00F3n de las columnas de alturas distintas: \u00ABSuperior\u00BB, \u00ABCentro\u00BB o \u00ABInferior\u00BB. \u00ABPredeterminado\u00BB les da a todas la altura de la m\u00E1s alta.
bootstrap5mix_createRow.rowHorizontalAlignment.ui.tooltip=Posici\u00F3n de las columnas cuando, juntas, son m\u00E1s estrechas que la fila. Sin efecto visible cuando las columnas llenan la fila, como ocurre con las disposiciones predefinidas.
bootstrap5mix_createRow.horizontalGutters.ui.tooltip=\u00ABNinguno\u00BB: las columnas se tocan. De 1 a 5: un espacio cada vez mayor. \u00ABPredeterminado\u00BB es el espacio est\u00E1ndar de Bootstrap (1,5rem, unos 24 p\u00EDxeles).
bootstrap5mix_createRow.verticalGutters.ui.tooltip=Espacio entre las columnas cuando pasan una debajo de otra, por ejemplo en pantallas peque\u00F1as. \u00ABNinguno\u00BB: sin espacio. De 1 a 5: cada vez mayor. \u00ABPredeterminado\u00BB: sin espacio.
bootstrap5mix_predefinedGrid.grid.ui.tooltip=Cada n\u00FAmero es la anchura de una columna; una fila completa vale 12. \u00AB4 / 8\u00BB es una columna estrecha seguida de otra el doble de ancha; \u00AB12\u00BB es una \u00FAnica columna.
bootstrap5mix_createAbsoluteAreas_description=Las columnas muestran un contenido guardado en una p\u00E1gina situada m\u00E1s arriba en el \u00E1rbol del sitio en lugar de un contenido propio: el mismo contenido aparece en todas las p\u00E1ginas situadas bajo esa p\u00E1gina.
bootstrap5mix_createAbsoluteAreas.level.ui.tooltip=\u00AB0 \u2014 P\u00E1gina de inicio\u00BB es la p\u00E1gina de inicio, 1 las p\u00E1ginas situadas justo debajo, y as\u00ED sucesivamente. El contenido se edita solo en esa p\u00E1gina; en las p\u00E1ginas inferiores se muestra y no se puede cambiar.
bootstrap5mix_listLimit_description=Limita el n\u00FAmero de contenidos que se muestran en cada columna.
bootstrap5mix_listLimit.listLimit.ui.tooltip=Los contenidos que superan este n\u00FAmero no se muestran, y los editores no pueden a\u00F1adir m\u00E1s. \u00ABSin l\u00EDmite\u00BB lo muestra todo.
bootstrap5nt_navbar.root.ui.tooltip=La p\u00E1gina cuyas subp\u00E1ginas forman el men\u00FA. \u00ABP\u00E1gina de inicio\u00BB: todo el sitio. \u00ABP\u00E1gina actual\u00BB: las p\u00E1ginas situadas bajo la p\u00E1gina mostrada. \u00ABP\u00E1gina padre\u00BB: las p\u00E1ginas del mismo nivel que la p\u00E1gina mostrada. \u00ABP\u00E1gina personalizada\u00BB: una p\u00E1gina que usted elige.
bootstrap5mix_navbarGlobalSettings_description=Lo que contiene la barra de navegaci\u00F3n.
bootstrap5mix_navbarGlobalSettings.addLoginButton.ui.tooltip=A\u00F1ade un bot\u00F3n \u00ABIniciar sesi\u00F3n\u00BB; una vez iniciada la sesi\u00F3n, un men\u00FA con el nombre del usuario y \u00ABCerrar sesi\u00F3n\u00BB.
bootstrap5mix_navbarGlobalSettings.addLanguageButton.ui.tooltip=A\u00F1ade un men\u00FA para leer la p\u00E1gina en otro idioma. Solo se muestra si el sitio tiene al menos dos idiomas.
bootstrap5mix_navbarGlobalSettings.addColorModeButton.ui.tooltip=A\u00F1ade un men\u00FA que permite a los visitantes elegir una visualizaci\u00F3n clara u oscura, o seguir el ajuste de su dispositivo. Su elecci\u00F3n se recuerda.
bootstrap5mix_navbarGlobalSettings.maxlevel.ui.tooltip=1 muestra solo el primer nivel de p\u00E1ginas. 2 a\u00F1ade sus subp\u00E1ginas en men\u00FAs desplegables; 3 y m\u00E1s a\u00F1aden submen\u00FAs anidados.
bootstrap5mix_navbarGlobalSettings.addContainerWithinTheNavbar.ui.tooltip=Alinea el contenido de la barra con el de la p\u00E1gina. Desmarque para una barra cuyo contenido ocupe toda la anchura.
bootstrap5mix_customizeNavbar_description=Para integradores: las clases CSS de cada parte de la barra de navegaci\u00F3n. Los campos vac\u00EDos usan los valores predeterminados de Bootstrap.
bootstrap5mix_customizeNavbar.navClass.ui.tooltip=Define los colores y el tama\u00F1o de pantalla a partir del cual el men\u00FA se muestra completo: navbar-expand-lg lo despliega en pantallas grandes. Para una barra que siga el modo oscuro, use bg-body-tertiary.
bootstrap5mix_brand_description=Nombre y logotipo que se muestran al inicio de esta barra de navegaci\u00F3n. Se ignora cuando hay una marca definida en el sitio.
bootstrap5mix_brand.brandText.ui.tooltip=Se muestra junto al logotipo. Con logotipo y sin texto, el nombre del sitio describe el logotipo a las personas que no pueden verlo.
bootstrap5mix_brand.brandImageMobile.ui.tooltip=Opcional. Se muestra en lugar del logotipo de escritorio mientras el men\u00FA est\u00E1 plegado.
bootstrap5mix_siteBrand_description=Nombre y logotipo que se muestran al inicio de todas las barras de navegaci\u00F3n del sitio. Sustituye a la marca definida en cada barra de navegaci\u00F3n.
bootstrap5mix_siteBrand.brandText.ui.tooltip=Se muestra junto al logotipo. Con logotipo y sin texto, el nombre del sitio describe el logotipo a las personas que no pueden verlo.
bootstrap5mix_siteBrand.brandImageMobile.ui.tooltip=Opcional. Se muestra en lugar del logotipo de escritorio mientras el men\u00FA est\u00E1 plegado.
bootstrap5mix_siteColorMode_description=Visualizaci\u00F3n clara u oscura de todo el sitio.
bootstrap5mix_siteColorMode.colorMode.ui.tooltip=El modo que obtienen los visitantes que no han elegido uno con el selector de la barra de navegaci\u00F3n.
bootstrap5mix_customRootPage.customRootPage.ui.tooltip=El men\u00FA enumera las subp\u00E1ginas de esta p\u00E1gina.
bootstrap5nt_pagination.displayPager.ui.tooltip=Si no est\u00E1 marcado, la lista se sigue dividiendo en p\u00E1ginas, pero los visitantes no tienen enlaces a las dem\u00E1s p\u00E1ginas.
bootstrap5mix_advancedPagination.nbOfPages.ui.tooltip=Por encima de este n\u00FAmero, la barra solo muestra las p\u00E1ginas cercanas a la actual.
bootstrap5mix_advancedPagination.nbOfPagesInEdit.ui.tooltip=En el modo de edici\u00F3n, la lista muestra este n\u00FAmero de elementos para que pueda acceder a todos sin cambiar de p\u00E1gina.
bootstrap5nt_progress.max.ui.tooltip=La parte que se rellena depende de la proporci\u00F3n entre el valor y el m\u00E1ximo. Con un valor de 30 y un m\u00E1ximo de 120, se rellena una cuarta parte de la barra.
bootstrap5nt_progress.striped.ui.tooltip=A\u00F1ade franjas diagonales a la parte rellena.
bootstrap5nt_tabs.type.ui.tooltip=Apariencia de la barra de pesta\u00F1as. Cada pesta\u00F1a es una lista de contenidos a\u00F1adida a este componente; su t\u00EDtulo es el texto de la pesta\u00F1a.
bootstrap5nt_tabs.align.ui.tooltip=Posici\u00F3n de las pesta\u00F1as en la barra. Las dos opciones ocupan toda la anchura de la barra. Con \u00ABRelleno\u00BB, la anchura de cada pesta\u00F1a depende de la longitud de su texto. Con \u00ABJustificado\u00BB, todas tienen la misma anchura.
bootstrap5nt_tabs.useListNameAsAnchor.ui.tooltip=La direcci\u00F3n de la p\u00E1gina puede abrir una pesta\u00F1a concreta (\u2026#nombre-de-la-lista). Si no est\u00E1 marcado, se usa un identificador t\u00E9cnico en lugar del nombre.
bootstrap5mix_Offcanvas.placement.ui.tooltip=Borde de la pantalla por el que entra el panel. \u00ABInicio\u00BB es la izquierda y \u00ABFin\u00BB la derecha en los idiomas que se leen de izquierda a derecha (LTR); si no, se invierten.
bootstrap5mix_colors.textColor.ui.tooltip=\u00ABBody\u00BB es el color normal del texto del sitio; \u00ABAtenuado\u00BB un gris m\u00E1s claro para un texto secundario. Compruebe que el texto sigue siendo legible sobre el fondo elegido.
bootstrap5mix_colors.backgroundColor.ui.tooltip=\u00ABPredeterminado\u00BB conserva el fondo est\u00E1ndar de una tarjeta.
bootstrap5mix_modal.modalSize.ui.tooltip=Anchura de la ventana en pantallas grandes. En un tel\u00E9fono ocupa siempre la anchura de la pantalla.
bootstrap5mix_advancedPagination.align.ui.tooltip=Posici\u00F3n de la barra de paginaci\u00F3n en la anchura de su contenedor.
bootstrap5nt_card.textAlign.ui.tooltip=Alineaci\u00F3n del texto de toda la tarjeta. \u00ABInicio\u00BB es la izquierda en los idiomas que se leen de izquierda a derecha.
