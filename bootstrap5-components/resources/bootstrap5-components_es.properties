bootstrap5nt_button.jcr_title.ui.tooltip=Texto que se muestra en el bot\u00F3n. Si est\u00E1 vac\u00EDo, un enlace interno muestra el t\u00EDtulo de la p\u00E1gina de destino y los dem\u00E1s botones muestran \u00ABLeer m\u00E1s\u00BB.
